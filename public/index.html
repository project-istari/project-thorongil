<title>Battle Lineup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://static.wikia.nocookie.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">

<style>
  /*
    Single-theme by intent: this is an instrument panel, and the game it serves
    is a dark command console. Every colour is painted explicitly so the page
    holds on any host ground.
  */
  :root {
    color-scheme: dark;

    --ground:     #080B08;
    --ground-2:   #0E120D;
    --panel:      #151B14;
    --panel-2:    #1D251B;
    --panel-hi:   #27311F;

    --ink:        #E8EFE1;
    --ink-soft:   #A3B29A;
    --ink-faint:  #77876F;

    --line:       #2E3A29;
    --line-hot:   #46552F;

    --amber:      #F5B145;
    --amber-dim:  #B98330;
    --amber-glow: rgba(245, 177, 69, 0.16);

    /* Army colours, taken from the game's own faction palette. */
    --usa:        #5FAEF2;
    --china:      #F2584A;
    --gla:        #B9CE55;

    --crit:       #F26A54;
    --warn:       #F5B145;
    --ok:         #7FD183;

    --display: "Chakra Petch", "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", ui-sans-serif, system-ui, sans-serif;
    --hud: "Share Tech Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --chamfer: 10px;
  }

  * { box-sizing: border-box; }

  body {
    background:
      radial-gradient(120% 70% at 50% 0%, #141C12 0%, var(--ground) 62%),
      repeating-linear-gradient(0deg, rgba(120,150,110,0.030) 0 1px, transparent 1px 3px),
      var(--ground);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.55;
    margin: 0;
    padding-block: 0 4rem;
    padding-inline: 16px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .shell { max-width: 1320px; margin-inline: auto; }

  /* Chamfered corners: the signature RTS panel edge. */
  .cut {
    clip-path: polygon(
      var(--chamfer) 0, 100% 0, 100% calc(100% - var(--chamfer)),
      calc(100% - var(--chamfer)) 100%, 0 100%, 0 var(--chamfer));
  }

  /* ---------------------------------------------------------- masthead --- */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1.5rem;
    padding-block: 1.5rem 1rem;
    border-bottom: 1px solid var(--line-hot);
    margin-bottom: 1.5rem;
    position: relative;
  }
  .masthead::after {
    content: "";
    position: absolute;
    left: 0; bottom: -1px;
    width: clamp(90px, 22%, 240px); height: 3px;
    background: var(--amber);
  }
  .wordmark {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2.1rem, 7.5vw, 3.2rem);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1;
    margin: 0;
    color: var(--ink);
    text-shadow: 0 0 28px rgba(245, 177, 69, 0.18);
  }
  .wordmark span { color: var(--amber); }
  .masthead .sub {
    margin: 0.45rem 0 0;
    color: var(--ink-soft);
    font-family: var(--hud);
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .readiness { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .readout {
    font-family: var(--hud);
    font-size: 0.76rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 0.32rem 0.6rem;
    white-space: nowrap;
  }
  .readout b { color: var(--amber); font-weight: 400; }

  /* ------------------------------------------------------------ layout --- */
  .board {
    display: grid;
    grid-template-columns: 360px minmax(0, 1fr);
    gap: 1.6rem;
    align-items: start;
  }
  @media (max-width: 980px) {
    .board { grid-template-columns: minmax(0, 1fr); gap: 1.2rem; }
    .rail { position: static; }
  }

  .rail {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
    display: grid;
    gap: 0.9rem;
    min-width: 0;
  }

  /* ---------------------------------------------------------- controls --- */
  .console {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    padding: 0.8rem 0.85rem 0.9rem;
    min-width: 0;
  }
  .console > legend {
    font-family: var(--hud);
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--amber);
    padding: 0;
    margin: 0 0 0.6rem;
  }
  fieldset.console { border: 1px solid var(--line); margin: 0; }

  /* side tabs */
  .sides { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-bottom: 0.55rem; }
  .side-tab {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.86rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: 2px solid var(--tab, var(--line));
    padding: 0.48rem 0.15rem;
    min-height: 38px;
    cursor: pointer;
    transition: color 120ms ease, background 120ms ease;
  }
  .side-tab:hover { color: var(--ink); background: var(--panel-hi); }
  .side-tab[aria-selected="true"] {
    color: var(--ink);
    background: var(--panel-hi);
    border-bottom-color: var(--tab, var(--amber));
  }
  .side-tab:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }

  /* ---- army cards, now with the commander's face on them ---------------- */
  .armies { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
  .armies.is-wide { grid-template-columns: minmax(0, 1fr); }

  .army {
    position: relative;
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr);
    gap: 0.55rem;
    align-items: center;
    text-align: left;
    font: inherit;
    min-height: 62px;
    padding: 0.4rem 0.5rem 0.42rem 0.55rem;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px solid var(--line);
    cursor: pointer;
    overflow: hidden;
    transition: background 130ms ease, color 130ms ease, border-color 130ms ease, transform 130ms ease;
  }
  .army.is-any { grid-template-columns: minmax(0, 1fr); }
  .army::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--mark, var(--line-hot));
  }
  .army:hover {
    background: var(--panel-hi); color: var(--ink);
    border-color: var(--mark, var(--line-hot));
    transform: translateY(-1px);
  }
  .army[aria-pressed="true"] {
    background:
      linear-gradient(90deg, color-mix(in srgb, var(--mark) 18%, transparent), transparent 60%),
      var(--panel-hi);
    border-color: var(--mark, var(--amber));
    color: var(--ink);
    box-shadow: inset 0 0 22px -8px var(--mark);
  }
  .army[aria-pressed="true"]::after {
    content: "";
    position: absolute;
    right: -1px; top: -1px;
    border-width: 0 13px 13px 0;
    border-style: solid;
    border-color: transparent var(--mark, var(--amber)) transparent transparent;
  }
  .army:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }

  /* Commander portrait. Falls back to the faction mark when the crawl has no
     art for this army, so the grid never shows a broken frame. */
  .portrait {
    position: relative;
    width: 52px; height: 52px;
    flex: none;
    background: var(--ground-2);
    border: 1px solid var(--line);
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .portrait img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 22%;
    filter: saturate(0.85) contrast(1.06);
    transition: filter 130ms ease, transform 130ms ease;
  }
  .army:hover .portrait img,
  .army[aria-pressed="true"] .portrait img { filter: saturate(1.1) contrast(1.1); transform: scale(1.05); }
  .portrait svg { width: 24px; height: 24px; opacity: 0.6; }
  .portrait::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 45%, rgba(8,11,8,0.6));
    pointer-events: none;
  }

  /* Name over commander. Without this the two spans flow inline and read as
     "CHINAStandard doctrine". */
  .army-text { display: grid; gap: 0.02rem; min-width: 0; }
  .army-name {
    font-family: var(--display);
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 1.15;
    color: inherit;
  }
  .army[aria-pressed="true"] .army-name { color: var(--mark, var(--amber)); }
  .army-who { font-family: var(--hud); font-size: 0.72rem; letter-spacing: 0.02em; color: var(--ink-faint); }

  /* rank / difficulty */
  .ranks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; }
  .rank {
    display: grid;
    justify-items: center;
    gap: 0.1rem;
    font: inherit;
    min-height: 54px;
    padding: 0.4rem 0.1rem;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-faint);
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .rank:hover { background: var(--panel-hi); color: var(--ink); }
  .rank .stars { font-size: 0.82rem; letter-spacing: 0.04em; line-height: 1.2; }
  .rank .rank-label {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .rank[aria-pressed="true"] {
    background: var(--panel-hi); color: var(--ink);
    border-color: var(--tone, var(--amber));
    box-shadow: inset 0 0 18px -8px var(--tone);
  }
  .rank[aria-pressed="true"] .stars { color: var(--tone, var(--amber)); }
  .rank:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }

  select, .command-btn {
    width: 100%;
    font-family: var(--body);
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 0.55rem 0.6rem;
    min-height: 46px;
  }
  select:hover, .command-btn:hover { background: var(--panel-hi); border-color: var(--line-hot); }
  .command-btn {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.92rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    cursor: pointer;
  }
  .command-btn:hover { box-shadow: inset 0 0 22px -8px var(--amber); }
  select:focus-visible, .command-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }

  /* The theatre picker gets its own preview diagram underneath. */
  .theatre-preview { margin-top: 0.6rem; }
  .theatre-preview svg { width: 100%; height: auto; display: block; border: 1px solid var(--line); background: var(--ground-2); }
  .theatre-caption {
    font-family: var(--hud); font-size: 0.68rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint); margin-top: 0.3rem;
  }

  /* ---------------------------------------------------------- briefing --- */
  .briefing { display: grid; gap: 1.2rem; min-width: 0; }

  .dossier {
    position: relative;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line-hot);
    padding: 1.1rem 1.2rem 1.2rem;
    min-width: 0;
    overflow: hidden;
  }
  .dossier::before {
    content: "";
    position: absolute; inset: 0 0 auto 0; height: 2px;
    background: linear-gradient(90deg, var(--amber), transparent 70%);
  }
  .eva {
    font-family: var(--hud);
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--amber-dim);
    margin-bottom: 0.7rem;
  }
  .eva b { color: var(--amber); font-weight: 400; }

  /* ---- the VS plate: two commanders facing each other ------------------- */
  .combatants { display: grid; gap: 0.7rem; align-items: stretch; }
  @media (min-width: 680px) {
    .combatants { grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; }
  }
  .combatant {
    display: flex; align-items: center; gap: 0.85rem; min-width: 0;
    background: linear-gradient(90deg, color-mix(in srgb, var(--mark) 16%, transparent), transparent 75%);
    border: 1px solid color-mix(in srgb, var(--mark) 40%, var(--line));
    border-left: 3px solid var(--mark);
    padding: 0.6rem 0.75rem;
  }
  @media (min-width: 680px) {
    .combatant.them {
      flex-direction: row-reverse; text-align: right;
      border-left: 1px solid color-mix(in srgb, var(--mark) 40%, var(--line));
      border-right: 3px solid var(--mark);
      background: linear-gradient(270deg, color-mix(in srgb, var(--mark) 16%, transparent), transparent 75%);
    }
  }
  /* Big commander portrait on the briefing header. */
  .mugshot {
    position: relative;
    width: clamp(84px, 13vw, 116px);
    aspect-ratio: 1;
    flex: none;
    border: 1px solid color-mix(in srgb, var(--mark) 55%, var(--line));
    background: var(--ground-2);
    overflow: hidden;
    display: grid; place-items: center;
    box-shadow: 0 0 26px -10px var(--mark);
  }
  .mugshot img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center 20%;
    filter: saturate(1.05) contrast(1.08);
  }
  .mugshot svg { width: 38px; height: 38px; opacity: 0.7; }
  .mugshot::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, transparent 55%, rgba(8,11,8,0.65)),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  .combatant .who { min-width: 0; }
  .combatant .army-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.2rem, 3.8vw, 1.72rem);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.12;
    overflow-wrap: anywhere;
    color: var(--mark);
  }
  .combatant .cmdr { font-family: var(--hud); font-size: 0.78rem; color: var(--ink-soft); letter-spacing: 0.04em; }
  .combatant .role {
    font-family: var(--hud); font-size: 0.66rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .clash {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 0.18em;
    color: var(--amber);
    text-align: center;
    padding: 0.2rem 0.5rem;
    text-shadow: 0 0 18px var(--amber-glow);
  }

  .assessment {
    margin: 1rem 0 0;
    font-size: 1.12rem;
    line-height: 1.5;
    color: var(--ink);
    border-left: 3px solid var(--amber);
    padding-left: 0.85rem;
    text-wrap: pretty;
  }

  .conditions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.95rem; }
  .cond {
    font-family: var(--hud);
    font-size: 0.74rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid var(--line-hot);
    background: var(--panel);
    padding: 0.25rem 0.55rem;
    color: var(--ink-soft);
  }
  .cond.is-easy   { border-color: var(--ok);   color: var(--ok); }
  .cond.is-medium { border-color: var(--warn); color: var(--warn); }
  .cond.is-hard,
  .cond.is-brutal { border-color: var(--crit); color: var(--crit); }

  /* panels */
  section.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 0.95rem 1rem 1.05rem;
    min-width: 0;
  }
  .panel > h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.08rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .panel > h2::before {
    content: "";
    width: 8px; height: 8px;
    background: var(--amber);
    transform: rotate(45deg);
    flex: none;
  }
  .panel > h2 .count {
    font-family: var(--hud);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    margin-left: auto;
    text-transform: uppercase;
  }

  /* segmented threat meters, RTS power-bar style */
  .meters { display: grid; gap: 0.55rem; }
  .meter { display: grid; gap: 0.2rem 0.7rem; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  @media (min-width: 560px) { .meter { grid-template-columns: 10rem minmax(0, 1fr) 2.6rem; } }
  .meter-name {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.92rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .segs { display: flex; gap: 2px; grid-column: 1 / -1; }
  @media (min-width: 560px) { .segs { grid-column: auto; } }
  .segs i { flex: 1; height: 13px; background: var(--panel-hi); border: 1px solid var(--line); }
  .segs i.on { background: var(--ok); border-color: var(--ok); box-shadow: 0 0 10px -3px var(--ok); }
  .segs.warn i.on { background: var(--warn); border-color: var(--warn); box-shadow: 0 0 10px -3px var(--warn); }
  .segs.crit i.on { background: var(--crit); border-color: var(--crit); box-shadow: 0 0 10px -3px var(--crit); }
  .meter-val {
    font-family: var(--hud); font-size: 0.82rem; color: var(--ink-soft);
    text-align: right; font-variant-numeric: tabular-nums;
    justify-self: end;
  }

  /* build queue */
  ol.queue { list-style: none; counter-reset: q; margin: 0; padding: 0; display: grid; gap: 3px; }
  ol.queue li {
    counter-increment: q;
    display: grid;
    grid-template-columns: 2.3rem minmax(0, 1fr);
    gap: 0.7rem;
    align-items: start;
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 0.5rem 0.65rem;
    font-size: 1rem;
    color: var(--ink-soft);
  }
  ol.queue li::before {
    content: counter(q, decimal-leading-zero);
    font-family: var(--hud);
    font-size: 0.84rem;
    color: var(--amber-dim);
    background: var(--ground-2);
    border: 1px solid var(--line);
    text-align: center;
    line-height: 1.6;
    font-variant-numeric: tabular-nums;
  }
  ol.queue li.is-priority { border-color: var(--crit); background: rgba(242, 106, 84, 0.08); color: var(--ink); }
  ol.queue li.is-priority::before { color: var(--crit); border-color: var(--crit); }

  /* ---- countermeasures: requisition cards with unit art ----------------- */
  .counters { display: grid; gap: 0.75rem; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); }
  .counter {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-top: 3px solid var(--line-hot);
    padding: 0.7rem 0.8rem 0.8rem;
    display: grid;
    gap: 0.6rem;
    align-content: start;
    min-width: 0;
  }
  .counter.is-crit { border-top-color: var(--crit); }
  .counter.is-warn { border-top-color: var(--warn); }
  .counter-head { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
  .counter-head h3 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.02rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0;
    color: var(--ink);
  }
  .counter-head .pres {
    margin-left: auto; font-family: var(--hud); font-size: 0.76rem;
    color: var(--ink-soft); font-variant-numeric: tabular-nums;
  }

  .units { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .unit {
    display: grid;
    grid-template-columns: 80px minmax(0, 1fr);
    gap: 0.75rem;
    align-items: start;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 0.45rem 0.55rem;
    transition: border-color 130ms ease, background 130ms ease;
  }
  .unit:hover { border-color: var(--line-hot); background: var(--panel-hi); }

  /* Unit photograph. 54 of 61 units resolve to one; the rest fall back to the
     faction mark rather than leaving a hole in the grid. */
  .shot {
    position: relative;
    width: 80px; height: 62px;
    background: var(--ground-2);
    border: 1px solid var(--line);
    overflow: hidden;
    display: grid; place-items: center;
  }
  .shot img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: saturate(0.9) contrast(1.05);
    transition: transform 160ms ease, filter 160ms ease;
  }
  .unit:hover .shot img { transform: scale(1.07); filter: saturate(1.15) contrast(1.1); }
  .shot svg { width: 22px; height: 22px; opacity: 0.45; }
  .shot::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 55%, rgba(8,11,8,0.5));
    pointer-events: none;
  }

  .unit-body { display: grid; gap: 0.12rem; min-width: 0; }
  .unit-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 0.5rem; }
  .unit-name {
    font-family: var(--display); font-weight: 600; font-size: 1rem;
    letter-spacing: 0.04em; color: var(--ink);
  }

<script>
/* --- engine/rng.js --- */
/** Deterministic PRNG so the same seed always yields the same suggestion. */

        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);

    infantry_swarm: 'Infantry hordes',
    artillery: 'Artillery / siege',
    stealth: 'Stealth',
    superweapon: 'Superweapons',
    economy: 'Economy snowball',
    base_defense: 'Base defences',
    early_rush: 'Early aggression',
    chemical: 'Toxins / fire',

    medium: { all: 1.0 },
    hard: { all: 1.15, early_rush: 1.35, economy: 1.3, superweapon: 1.2 },
    brutal: { all: 1.3, early_rush: 1.6, economy: 1.5, superweapon: 1.35 },

    easy: 'The AI will not rush you and rarely expands. You can afford a greedy opening and tech straight to what you actually want to play with.',
    medium: 'The AI expands once and attacks in waves. Hold your first defensive line, then out-tech it.',
    hard: 'The AI attacks early, expands aggressively and keeps producing while it fights. You need a defensive structure up before you tech.',
    brutal: 'Assume constant pressure and a faster economy than yours. Deny expansions early or you will simply be out-produced.',

/**

        out.air += open * 0.3 * (enemy.threat.air > 0 ? 1 : 0);
        out.artillery += choke * 0.5 * (enemy.threat.artillery > 0 ? 1 : 0);
        out.base_defense += choke * 0.5;
        out.stealth += choke * 0.3 * (enemy.threat.stealth > 0 ? 1 : 0);
        out.early_rush -= supply * 0.4; // rich supply means longer games
        out.superweapon += supply * 0.5 * (enemy.threat.superweapon > 0 ? 1 : 0);

/* --- engine/counters.js --- */
const AXIS_GUIDANCE = {
    air: 'Keep anti-air inside the army ball, not just in the base. Aircraft pick off stragglers first.',
    armor: 'Anti-tank infantry in garrisons and buildings trade far better than tank-for-tank.',
    infantry_swarm: 'Area damage beats target count. Flame, toxin, artillery and strafing runs all scale where single-target fire does not.',
    artillery: 'Artillery cannot defend itself. Anything fast that reaches it kills it — aircraft most reliably.',
    stealth: 'A detector must travel with the army, not sit in the base. Without one you are fighting blind.',
    superweapon: 'Spread your base so no single shot takes two buildings, and kill the launcher rather than racing it.',
    economy: 'Raid supply lines. Killing workers and dozers costs them more than killing their army does.',
    base_defense: 'Out-range it or go over it. Walking into a defensive envelope is how armies disappear.',
    early_rush: 'Get one defensive structure and a handful of cheap units up before you tech. Surviving is the whole plan.',
    chemical: 'Go mechanised. Toxins and fire do very little to vehicles and nothing to aircraft.',

    const tierBonus = unit.tier === 'early' ? 0.4 : unit.tier === 'mid' ? 0.2 : 0;
    const costPenalty = Math.min(0.6, unit.cost / 4000);

}
/**
 * For each axis the enemy actually pressures, the units in your roster that
 * answer it, best first.

function recommendCounters(you, roster, profile, maxAxes = 5) {
    const axes = rankedAxes(profile).slice(0, maxAxes);
    return axes.map((axis) => {
        const units = roster
            .map((u) => ({ unit: u, score: unitScore(u, axis) }))
            .filter((x) => x.score > 0)
            .sort((a, b) => b.score - a.score || a.unit.cost - b.unit.cost)
            .slice(0, 3)
            .map(({ unit }) => ({ name: unit.name, cost: unit.cost, tier: unit.tier, why: unit.note }));
        const guidance = units.length
            ? AXIS_GUIDANCE[axis]

/** How well an army covers a given axis, 0-3. Used for lineup scoring. */
function coverage(roster, axis) {
    let best = 0;

        if (a > best)
            best = a;
        if (a >= 2)

    return Math.min(3, best + Math.min(0.75, depth * 0.25));

/* --- engine/lineup.js --- */
/**
 * Map a raw score onto 0-100.
 *
 * The bounds come from sampling every army against every army at every

 * that band across the full range instead of saturating at the top.
 * See test/lineup.test.ts, which fails if the spread collapses again.

            bestCounterAxis = axis;

        offense += (you.threat[axis] ?? 0) * (enemy.vulnerability[axis] ?? 0);
        const r = pressure * (you.vulnerability[axis] ?? 0);

        ? `Answers their ${AXIS_LABEL[bestCounterAxis].toLowerCase()} well; most exposed to ${AXIS_LABEL[worstRiskAxis].toLowerCase()}.`

}
function rankLineups(candidates, rosterFor, enemy, profile) {
    return candidates
        .map((f) => scoreFaction(f, rosterFor(f.id), enemy, profile))
        .sort((a, b) => b.score - a.score);

/* --- engine/plan.js --- */
const DO_NOT = {

    infantry_swarm: 'Do not trade expensive units one-for-one against cheap infantry. You will run out of credits first.',
    artillery: 'Do not let your army sit still inside artillery range. Spread out, or close the distance and kill the guns.',
    stealth: 'Do not advance through unscouted ground. Without a detector attached to the army you are walking into whatever is already there.',
    superweapon: 'Do not cluster your production. One superweapon shot should never be able to cost you two buildings.',
    economy: 'Do not settle into a long game while they out-mine you. Contest a supply pile or raid the one they are on.',
    base_defense: 'Do not push into their defensive envelope without out-ranging it first. That is how whole armies vanish.',
    early_rush: 'Do not tech greedily. One defensive structure and a few cheap units first, every time.',

function planFrom(ds, input) {
    const rand = mulberry32(input.seed ?? 0x5eed);
    const factionById = (id) => ds.factions.find((f) => f.id === id);
    const unitsFor = (id) => ds.units.filter((u) => u.factions?.includes(id));
    const mapById = (id) => ds.maps.find((m) => m.id === id) ?? ds.maps.find((m) => slug(m.name) === slug(id));
    const map = input.mapId ? mapById(input.mapId) : undefined;
    if (input.mapId && !map)
        throw new Error(`Unknown map: ${input.mapId}`);
    // Enemy: chosen, or picked at random so the plan is still a real matchup.
    const enemy = input.enemy
        ? factionById(input.enemy)
        : ds.factions[Math.floor(rand() * ds.factions.length)];
    if (!enemy)
        throw new Error(`Unknown faction: ${input.enemy}`);
    const profile = enemyThreatProfile(enemy, input.difficulty, map);
    // Your side: chosen, or the engine picks the best answer to that enemy.
    let you = input.you ? factionById(input.you) : undefined;
    if (input.you && !you)
        throw new Error(`Unknown faction: ${input.you}`);
    let ranking;
    let rationale;
    if (!you) {
        const ranked = rankLineups(ds.factions, unitsFor, enemy, profile);
        ranking = ranked.map((r) => ({ faction: r.faction, score: r.score, why: r.why }));
        you = ranked[0].faction;
        rationale = [
            `Picked ${you.name} because it scores highest against ${enemy.name} on this difficulty${map ? ` and on ${map.name}` : ''}.`,
            ranked[0].why,
            ranked[1] ? `Next best: ${ranked[1].faction.name} (${ranked[1].score}/100).` : '',
        ].filter(Boolean);
    }
    const roster = unitsFor(you.id);
    const counters = recommendCounters(you, roster, profile);
    const top = rankedAxes(profile);
    const headline = `${you.name} vs ${enemy.name}` +
        (map ? ` on ${map.name}` : '') +
        ` — ${input.difficulty.toUpperCase()}. ` +
        (top[0]
            ? `Their game is ${AXIS_LABEL[top[0]].toLowerCase()}; answer that first and the rest follows.`
            : 'A soft matchup — play your standard opening and take the map.');
    const watchFor = [
        ...enemy.signatureTactics,
        ...enemy.quirks.slice(0, 1),
        DIFFICULTY_NOTE[input.difficulty],
    ];
    const mapNotes = map
        ? [...map.notes, `${map.players} players, ${map.terrain} terrain. Chokepoints ${map.chokepoints}/3, supply ${map.supplyDensity}/3, open ground ${map.openness}/3.`]
        : ['No map selected — pick one to get terrain-specific advice on chokepoints, supply and expansion timing.'];
    return {
        you,
        enemy,
        difficulty: input.difficulty,
        ...(map ? { map } : {}),
        ...(rationale ? { lineupRationale: rationale } : {}),
        ...(ranking ? { lineupRanking: ranking } : {}),
        headline,
        buildOrder: buildOrder(you, roster, profile, enemy),
        counters,
        timeline: timeline(you, profile, input.difficulty, enemy, map),
        watchFor,
        doNot: doNotList(you, profile),
        mapNotes,
        matchupNotes: collectMatchupNotes(ds.matchups, you, enemy),
    };
}

upport tank introduced by the USA in the latter stages of the conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/d/d7/ZH_Microwave_Tank.jpg/revision/latest?cb=20240910132028"},{"id":"avenger","name":"Avenger","factions":["usa","usa_air","usa_laser","usa_super"],"domain":"ground","roles":["anti_air","support"],"cost":2000,"tier":"late","answers":{"air":3},"note":"Mobile anti-air that also blanks enemy missiles aimed at the units around it.","source":"merged","wikiPage":"Avenger","description":"The Avenger was an American laser-based self-propelled anti-aircraft gun and support vehicle based on the Humvee's chassis and introduced later in the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/3/39/Generals_Avenger.jpg/revision/latest?cb=20180801164036"},{"id":"raptor","name":"Raptor","factions":["usa","usa_laser","usa_super"],"domain":"air","roles":["aircraft","anti_vehicle"],"cost":1400,"tier":"mid","answers":{"armor":3,"artillery":3},"note":"Fast strike aircraft; the fastest way to kill artillery and a tank ball.","source":"merged","wikiPage":"Raptor","description":"The Raptor is the USA's primary all-purpose fighter aircraft during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/f/f0/Gen1_Raptor.jpg/revision/latest?cb=20180801165232"},{"id":"king_raptor","name":"King Raptor","factions":["usa_air"],"domain":"air","roles":["aircraft","anti_vehicle"],"cost":1100,"tier":"mid","answers":{"armor":3,"artillery":3,"air":2},"note":"Granger's upgraded Raptor: tougher, harder hitting, and able to contest other aircraft.","source":"merged","wikiPage":"King_Raptor","description":"The King Raptor is an advanced variant of the standard Raptor multirole combat aircraft used by the USA during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/8/83/Generals_King_Raptor.jpg/revision/latest?cb=20180801165231"},{"id":"comanche","name":"Comanche","factions":  during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/8/8d/Generals_Aurora.jpg/revision/latest?cb=20180801165217"},{"id":"aurora_alpha","name":"Aurora Alpha","factions":["usa_air"],"domain":"air","roles":["aircraft","anti_structure"],"cost":2000,"tier":"late","answers":{"base_defense":3,"superweapon":3,"infantry_swarm":3},"note":"Aurora with a bigger blast — deletes a superweapon or a production cluster per run.","source":"merged","wikiPage":"Aurora_Alpha","description":"The Aurora Alpha is a supersonic tactical bomber utilized by the USA General Alexis Alexander as an improvement to the Aurora, carrying a destructive Fuel Air Bomb in Zero Hour.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/9/9f/Generals_Aurora_Alpha.jpg/revision/latest?cb=20180801163931"},{"id":"patriot","name":"Patriot Battery","factions":["usa","usa_laser","usa_super"],"domain":"ground","roles":["defense","anti_air","anti_vehicle"],"cost":1000,"tier":"early","answers":{"air":2,"armor":1,"early_rush":2},"note":"The base-defence backbone: cheap, covers both air and ground approaches.","source":"curated","wikiPage":"Patriot_Battery"},{"id":"emp_patriot","name":"EMP Patriot","factions":["usa_super"],"domain":"ground","roles":["defense","anti_vehicle"],"cost":900,"tier":"early","answers":{"armor":3,"early_rush":2},"note":"Strands enemy vehicles motionless inside your defensive envelope.","source":"merged","wikiPage":"EMP_Patriot","description":"The EMP Patriot system was a variant of the Patriot missile system developed by General Alexis Alexander.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/c/c4/Generals_EMP_Patriot.jpg/revision/latest?cb=20180801164657"},{"id":"laser_turret","name":"Laser Turret","factions":["usa_laser"],"domain":"ground","roles":["defense","anti_air","anti_vehicle"],"cost":1000,"tier":"early","answers":{"air":2,"armor":2,"early_rush":2},"note":"Best damage per credit of any static defence — as long as the power stays on.","source":"curated","wikiPage":"Laser_Turret"},{"id":"firebase","name":"Firebase","factions":["usa","usa_laser","usa_super"],"domain":"ground","roles":["defense","anti_infantry"],"cost":1000,"tier":"early","answers":{"infantry_swarm":2,"early_rush":2},"note":"Garrison it with Missile Defenders and it covers armour and air at once.","source":"merged","wikiPage":"Firebase","description":"The Firebase was a USA base defense structure developed midway through the conflict with the GLA, in order to cover shortcomings that had become apparent in the Patriot Missile System.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/b/b6/Generals_Fire_Base.jpg/revision/latest?cb=20180801164824"},{"id":"red_guard","name":"Red Guard","factions":["china","china_tank","china_infantry","china_nuke"],"domain":"infantry","roles":["anti_infantry","garrison_clear"],"cost":300,"tier":"early","answers":{"infantry_swarm":2,"early_rush":1},"note":"Comes in pairs and benefits from the horde bonus; the cheapest ground you can hold.","source":"merged","wikiPage":"Red_Guard","description":"The Red Guards were the basic infantry of the Chinese Army during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/2/2f/Generals_ZH_-_Red_Guards.png/revision/latest?cb=20211026125450"},{"id":"tank_hunter","name":"Tank Hunter","factions":["china","china_tank","china_infantry","china_nuke"],"domain":"infantry","roles":["anti_vehicle","anti_air"],"cost":300,"tier":"early","answers":{"armor":3,"air":1,"early_rush":2},"note":"Garrisoned Tank Hunters break any early armour push at a fraction of its cost.","source":"merged","wikiPage":"Tank_Hunter","description":"Tank Hunters were China's main anti-tank/air infantry during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/3/3f/Generals_Tank_Hunter.jpg/revision/latest?cb=20180801164653"},{"id":"minigunner","name":"Minigunner","factions":["china_infantry"],"d lm or a bunker onto it.","source":"merged","wikiPage":"Helix","description":"The Helix, also called the Overlord of the sky, is a heavy transport helicopter used by China, introduced in Command & Conquer: Generals - Zero Hour.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/9/94/ZH_Helix.jpg/revision/latest?cb=20231211105705"},{"id":"gattling_cannon","name":"Gattling Cannon","factions":["china","china_tank","china_infantry","china_nuke"],"domain":"ground","roles":["defense","anti_air","anti_infantry"],"cost":1000,"tier":"early","answers":{"air":3,"infantry_swarm":3,"early_rush":2},"note":"One building that answers both aircraft and infantry; put it on the approach early.","source":"curated","wikiPage":"Gattling_Cannon"},{"id":"bunker","name":"Bunker","factions":["china","china_tank","china_infantry","china_nuke"],"domain":"ground","roles":["defense","anti_infantry"],"cost":500,"tier":"early","answers":{"early_rush":2,"infantry_swarm":1,"armor":1},"note":"Fill it with Tank Hunters and it stops an early armour push cold.","source":"merged","wikiPage":"Bunker","description":"Bunkers were basic but effective defensive structures deployed by Chinese generals during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/2/25/ZH_Bunker.jpg/revision/latest?cb=20231213143457"},{"id":"rebel","name":"Rebel","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"infantry","roles":["anti_infantry","scout","capture"],"cost":150,"tier":"early","answers":{"infantry_swarm":1,"early_rush":1,"economy":1},"note":"Dirt cheap, can capture buildings, and with Camo Netting it scouts unseen.","source":"merged","wikiPage":"Rebel","description":"Rebels were the GLA's basic soldiers during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/a/ab/Generals_Rebel.jpg/revision/latest?cb=20180801164856"},{"id":"rpg_trooper","name":"RPG Trooper","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"infantry","roles":["anti_vehicle","anti_air"],"cost":300,"tier":"early","answers":{"armor":3,"air":1,"early_rush":2},"note":"The GLA answer to armour. In numbers, and in garrisons, it beats tanks on cost.","source":"merged","wikiPage":"RPG_Trooper","description":"The RPG Trooper was the basic anti-armor/air infantry unit of the GLA during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/0/05/ZH_RPG_Trooper.jpg/revision/latest?cb=20240121133733"},{"id":"terrorist","name":"Terrorist","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"infantry","roles":["suicide","anti_vehicle","anti_structure"],"cost":200,"tier":"early","answers":{"armor":3,"base_defense":1},"note":"The cheapest tank kill in the game. It only has to reach the target once.","source":"merged","wikiPage":"Terrorist","description":"The Terrorist is GLA suicide infantry in Generals.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/1/1a/Generals_Terrorist.jpg/revision/latest?cb=20180801164038"},{"id":"hijacker","name":"Hijacker","factions":["gla","gla_stealth","gla_demo"],"domain":"infantry","roles":["capture","stealth"],"cost":400,"tier":"mid","answers":{"armor":3},"note":"Takes an enemy vehicle intact. Against an expensive army this is pure profit.","source":"merged","wikiPage":"Hijacker","description":"Hijackers were GLA-affiliated thieves capable of commandeering vehicles, seen during the GLA Conflict."},{"id":"saboteur","name":"Saboteur","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"infantry","roles":["capture","stealth","support"],"cost":800,"tier":"mid","answers":{"economy":2,"base_defense":2,"superweapon":2},"note":"Sneaks into a building to steal credits, reset a superweapon timer or cut power.","source":"merged","wikiPage":"Saboteur","description":"Saboteurs were stealthed GLA infiltration infantry units, seen in the late stages of the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/e/e1/Generals_Saboteur.jpg/revision/latest?cb=20180801164255"},{"id":"jarmen_kell","name":"Jarmen Kell","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"infantry","roles":["hero","anti_infantry","stealth"],"cost":1500,"tier":"mid","answers":{"armor":3,"infantry_swarm":2},"note":"Snipes vehicle crews from stealth; your infantry then walk into the empty tanks.","source":"merged","wikiPage":"Jarmen_Kell","description":"Jarmen Kell (Arabic: جارمين كيل) was a highly skilled Arabian sharpshooter in the employ of the GLA during the events of Generals and Zero Hour.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/4/47/G2_Storyboard_The_Dam_Kell.jpg/revision/latest?cb=20180801164707"},{"id":"angry_mob","name":"Angry Mob","factions":["gla","gla_toxin","gla_demo"],"domain":"infantry","roles":["anti_infantry","garrison_clear"],"cost":800,"tier":"mid","answers":{"infantry_swarm":2,"base_defense":1},"note":"A crowd that keeps replacing itself; good at swamping a position cheaply.","source":"merged","wikiPage":"Angry_Mob","description":"Angry mobs were GLA-affiliated groups of enraged common folk, seen during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/8/8f/Generals_Angry_Mob.jpg/revision/latest?cb=20180801163721"},{"id":"technical","name":"Technical","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"ground","roles":["anti_infantry","scout","transport"],"cost":500,"tier":"early","answers":{"infantry_swarm":2,"early_rush":2},"note":"The GLA's early map control; fast, disposable, and upgrades itself off salvage.","source":"merged","wikiPage":"Technical","description":"The Technical is a GLA armed pickup truck Generals and Zero Hour.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/7/77/CNCG_Technicals.jpg/revision/latest?cb=20180801165214"},{"id":"scorpion","name":"Scorpion Tank","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"ground","roles":["anti_vehicle"],"cost":600,"tier":"early","answers":{"armor":2,"early_rush":2},"note":"Cheap armour that wins on numbers rather than on any single engagement.","source":"merged","wikiPage":"Scorpion_Tank","description":"The Scorpion tank was the GLA's light tank during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/0/0b/ZH_Scorpion.jpg/revision/latest?cb=20231218055211"},{"id":"marauder","name":"Marauder Tank","factions":["gla","gla_stealth","gla_demo"],"domain":"ground","roles":["anti_vehicle"],"cost":800,"tier":"mid","answers":{"armor":3},"note":"Salvage upgrades turn it into a genuine main battle tank as the game runs on.","source":"merged","wikiPage":"Marauder_Tank","description":"The Marauder tank was a medium tank used by the Global Liberation Army during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/c/cd/ZH_Marauder_tank.jpg/revision/latest?cb=20231218064927"},{"id":"quad_cannon","name":"Quad Cannon","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"ground","roles":["anti_air","anti_infantry"],"cost":700,"tier":"early","answers":{"air":3,"infantry_swarm":3},"note":"The only real anti-air the GLA has. Build it before you think you need it.","source":"merged","wikiPage":"Quad_Cannon","description":"The Quad Cannon was a Soviet-era weapon (the ZSU-23-4 Shilka's modified AZP-23 Amur mounted on the back of a half-track) recycled by the GLA by the time of the GLA Conflict as their self-propelled anti-aircraft gun.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/8/8e/ZH_Quad_Cannon.jpg/revision/latest?cb=20231218070330"},{"id":"rocket_buggy","name":"Rocket Buggy","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"ground","roles":["artillery","anti_vehicle"],"cost":900,"tier":"mid","answers":{"armor":2,"base_defense":2,"artillery":2},"note":"Fast artillery that fires and withdraws before anything slow can answer it.","source":"merged","wikiPage":"Rocket_Buggy","description":"The Rockey Buggy is a GLA improvised multiple rocket launcher in Generals and Zero Hour.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/a/ad/ZH_Rocket_Buggy.jpg/revision/latest?cb=20231229165900"},{"id":"toxin_tractor","name":"Toxin Tractor","factions":["gla","gla_toxin"],"domain":"ground","roles":["garrison_clear","anti_infantry"],"cost":600,"tier":"early","answers":{"infantry_swarm":3,"base_defense":1},"note":"Clears garrisons and infantry instantly, and poisons the ground they stood on.","source":"merged","wikiPage":"Toxin_Tractor","description":"The toxin tractor was the GLA's dedicated anti-infantry and anti-garrison vehicle during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/4/49/ZH_Toxin_Tractor.jpg/revision/latest?cb=20231218074409"},{"id":"battle_bus","name":"Battle Bus","factions":["gla","gla_stealth","gla_demo"],"domain":"ground","roles":["transport","anti_infantry","defense"],"cost":800,"tier":"mid","answers":{"infantry_swarm":2,"early_rush":2},"note":"Rolling bunker: infantry fire from inside, and it becomes a wreck that keeps fighting.","source":"curated","wikiPage":"Combat_Bus"},{"id":"scud_launcher","name":"SCUD Launcher","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"ground","roles":["artillery","anti_structure"],"cost":1200,"tier":"mid","answers":{"base_defense":3,"infantry_swarm":2,"artillery":2},"note":"Long-range siege that out-ranges most defences; toxin warheads deny the ground after.","source":"merged","wikiPage":"SCUD_Launcher","description":"The SCUD Launcher is GLA's mobile ballistic missile system during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/c/c0/ZH_SCUD_Launcher.jpg/revision/latest?cb=20231219055916"},{"id":"bomb_truck","name":"Bomb Truck","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"ground","roles":["suicide","anti_structure","stealth"],"cost":1200,"tier":"mid","answers":{"base_defense":3,"superweapon":3},"note":"Disguises itself as an enemy vehicle and drives into whatever matters most.","source":"merged","wikiPage":"Bomb_Truck","description":"The Bomb Truck is a GLA suicide vehicle in Generals and Zero Hour.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/9/9b/ZH_Bomb_Truck.jpg/revision/latest?cb=20231218071339"},{"id":"radar_van","name":"Radar Van","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"ground","roles":["scout","detector","support"],"cost":500,"tier":"mid","answers":{"stealth":3},"note":"The GLA detector, and its radar scan reveals what the enemy is actually building.","source":"merged","wikiPage":"Radar_Van","description":"The radar van was a GLA vehicle with a mobile radar uplink used during the GLA Conflict.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/c/c2/Generals_Radar_Van.jpg/revision/latest?cb=20180801164956"},{"id":"stinger_site","name":"Stinger Site","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"ground","roles":["defense","anti_air","anti_vehicle"],"cost":900,"tier":"early","answers":{"air":3,"armor":1,"early_rush":1},"note":"Three-man anti-air nest; the GLA's only serious answer to sustained air pressure.","source":"merged","wikiPage":"Stinger_Site","description":"The Stinger Site was a simple defense that served as the basic anti-air and anti-tank defense of the GLA.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/e/e2/Generals_Stinger_Site.jpg/revision/latest?cb=20180801163707"},{"id":"tunnel_network","name":"Tunnel Network","factions":["gla","gla_toxin","gla_stealth","gla_demo"],"domain":"ground","roles":["transport","defense","support"],"cost":800,"tier":"early","answers":{"early_rush":2,"base_defense":1},"note":"Moves the army across the map instantly and heals whatever sits inside it.","source":"merged","wikiPage":"Tunnel_Network","description":"The Tunnel Network was a unique structure used by the Global Liberation Army in Command & Conquer: Generals and its expansion, Zero Hour.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/6/61/ZH_Tunnel_Network.jpg/revision/latest?cb=20240918130034"},{"id":"demo_trap","name":"Demolition Trap","factions":["gla","gla_demo"],"domain":"ground","roles":["defense","suicide"],"cost":400,"tier":"early","answers":{"early_rush":3,"armor":2},"note":"Buried charge on a chokepoint or a supply pile; it pays for itself the first time.","source":"merged","wikiPage":"Demo_Trap","description":"Demo traps were GLA explosive devices.","image":"https://static.wikia.nocookie.net/cnc_gamepedia_en/images/f/fa/Generals_Demo_Trap.jpg/revision/latest?cb=20180801163739"}],"maps":[{"id":"tournament_desert","name":"Tournament Desert","players":2,"size":"2p","terrain":"desert","chokepoints":1,"supplyDensity":2,"openness":3,"features":["Open central basin","Symmetrical supply docks","Minimal cover"],"notes":["Almost no terrain to hide behind — whoever wins the open-field engagement wins the map.","Expansion supply is exposed; raiding workers pays better here than anywhere."],"source":"merged","wikiPage":"Tournament_Desert","description":"A list of skirmish maps available in Generals 1."},{"id":"tournament_plains","name":"Tournament Plains","players":2,"size":"2p","terrain":"temperate","chokepoints":1,"supplyDensity":2,"openness":3,"features":["Flat approaches","Twin supply centres","Long sight lines"],"notes":["Long sight lines favour artillery and air; short-ranged armies must force the distance closed.","There is no chokepoint to turtle behind — mobile defence beats static defence."],"source":"curated","wikiPage":"Tournament_Plains"},{"id":"alpine_assault","name":"Alpine Assault","players":2,"size":"2p","terrain":"snow","chokepoints":3,"supplyDensity":1,"openness":1,"features":["Narrow mountain pass","Cliff-locked approaches","Sparse supply"],"notes":["One real land route: static defence and artillery are disproportionately strong.","Thin supply rewards early expansion and punishes greedy tech."],"source":"curated","wikiPage":"Alpine_Assault"},{"id":"bitter_winter","name":"Bitter Winter","players":2,"size":"2p","terrain":"snow","chokepoints":2,"supplyDensity":2,"openness":2,"features":["Frozen river crossing","Garrisonable structures","Central high ground"],"notes":["The crossings are the whole game — hold one and the map halves.","Garrisonable buildings near the middle make early infantry unusually valuable."],"source":"curated","wikiPage":"Bitter_Winter"},{"id":"winding_river","name":"Winding River","players":2,"size":"2p","terrain":"temperate","chokepoints":3,"supplyDensity":2,"openness":1,"features":["River splits the map","Few bridges","Defensible banks"],"notes":["Bridges are hard chokepoints: mine them, defend them, or bypass them by air or tunnel.","Artillery across the river hits with impunity if you do not contest the bank."],"source":"curated","wikiPage":"Winding_River"},{"id":"barren_badlands","name":"Barren Badlands","players":4,"size":"4p","terrain":"desert","chokepoints":2,"supplyDensity":2,"openness":2,"features":["Rocky outcrops","Scattered supply piles","Multiple approach lanes"],"notes":["Several approach lanes mean a single defensive line does not cover you.","Scattered supply favours whoever can protect two piles at once."],"source":"curated","wikiPage":"Barren_Badlands"},{"id":"mountain_path","name":"Mountain Path","players":4,"size":"4p","terrain":"temperate","chokepoints":3,"supplyDensity":1,"openness":1,"features":["Cliff-lined paths","Choked centre","Limited expansion"],"notes":["Heavily choked: siege units and base defences dominate over manoeuvre.","With supply this thin, an early expansion denial usually decides it."],"source":"curated","wikiPage":"Mountain_Path"},{"id":"tournament_island","name":"Tournament Island","players":4,"size":"4p","terrain":"temperate","chokepoints":2,"supplyDensity":3,"openness":2,"features":["Water separates quadrants","Rich supply","Oil derricks"],"notes":["Water breaks up ground pushes — air and long-range units cross freely, armour does not.","Oil derricks are worth capturing early and worth raiding all game."],"source":"curated","wikiPage":"Tournament_Island"},{"id":"silent_woods","name":"Silent Woods","players":4,"size":"4p","terrain":"temperate","chokepoints":2,"supplyDensity":2,"openness":2,"features":["Tree cover","Garrisonable cabins","Winding approaches"],"notes":["Tree cover and winding lanes make ambushes and stealth armies much stronger here.","Scout constantly — an army can sit fifteen seconds from your base unseen."],"source":"curated","wikiPage":"Silent_Woods"},{"id":"flash_fire","name":"Flash Fire","players":4,"size":"4p","terrain":"desert","chokepoints":1,"supplyDensity":2,"openness":3,"features":["Wide open flats","Central supply contest","Exposed expansions"],"notes":["Open flats: the fight is decided by army composition, not by position.","Central supply is a permanent contest — plan to fight for it, not to own it."],"source":"curated","wikiPage":"Flash_Fire"},{"id":"killing_fields","name":"Killing Fields","players":4,"size":"4p","terrain":"temperate","chokepoints":2,"supplyDensity":3,"openness":2,"features":["Dense supply","Multiple bridges","Garrisonable farms"],"notes":["Rich supply lets both sides tech fast — expect superweapons and late-game armies.","Garrisonable farms along the lanes reward keeping infantry in the army all game."],"source":"curated","wikiPage":"Killing_Fields"},{"id":"forgotten_forest","name":"Forgotten Forest","players":4,"size":"4p","terrain":"jungle","chokepoints":3,"supplyDensity":2,"openness":1,"features":["Heavy tree cover","Narrow trails","Hidden flanks"],"notes":["Narrow trails and heavy cover: this is the best stealth map in the stock rotation.","Detection is not optional here, whatever you are playing against."],"source":"curated","wikiPage":"Forgotten_Forest"},{"id":"dark_mountain","name":"Dark Mountain","players":4,"size":"4p","terrain":"snow","chokepoints":3,"supplyDensity":1,"openness":1,"features":["Mountain chokepoints","Sparse supply","High ground positions"],"notes":["Sparse supply and hard chokes reward a fast expansion followed by a turtle.","High ground positions give artillery a commanding field of fire."],"source":"curated","wikiPage":"Dark_Mountain"},{"id":"leipzig_lowlands","name":"Leipzig Lowlands","players":4,"size":"4p","terrain":"urban","chokepoints":2,"supplyDensity":2,"openness":2,"features":["Urban blocks","Dense garrisons","Street chokepoints"],"notes":["Urban garrisons make infantry and garrison-clearing units decisive.","Streets funnel armour — bring something that clears buildings or you will stall."],"source":"curated","wikiPage":"Leipzig_Lowlands"},{"id":"scorched_earth","name":"Scorched Earth","players":6,"size":"6p","terrain":"desert","chokepoints":1,"supplyDensity":2,"openness":3,"features":["Sprawling open ground","Many expansions","Long travel times"],"notes":["Long travel times mean reinforcements arrive late — forward production matters.","With six players, the diplomatic and positional read matters as much as the build."],"source":"curated","wikiPage":"Scorched_Earth"},{"id":"homeland_alliance","name":"Homeland Alliance","players":8,"size":"8p","terrain":"mixed","chokepoints":2,"supplyDensity":3,"openness":2,"features":["Eight starting positions","Abundant supply","Mixed terrain"],"notes":["Eight players and rich supply means the game goes long — build for the late game.","Expect superweapons; spread your base from the first dozer."],"source":"curated","wikiPage":"Homeland_Alliance"}],"matchups":[{"you":"*","enemy":"gla","advice":["The GLA has no aircraft whatsoever. Any air investment you make is unanswerable except by Quad Cannons and Stinger Sites — scout for those, then fly.","Destroyed GLA buildings leave holes that rebuild cheaply. Killing a structure is a delay, not a removal: kill the workers too.","Watch for Tunnel Networks near your base. A tunnel is a teleport pad for an army you never saw cross the map."]},{"you":"*","enemy":"usa","advice":["USA units cost more than yours. Trading evenly is winning — force engagements you can afford to lose.","Airfields are large and fragile. A raid that kills parked aircraft costs them far more than it costs you.","They are weakest before the first Airfield lands. Apply pressure early or accept a late-game air war."]},{"you":"*","enemy":"china","advice":["Do not let five identical Chinese units sit together — the horde bonus makes that ball much stronger than its cost.","China has almost no stealth and poor detection. A stealthed or flanking force will get behind them.","Their units are slow. Kiting, artillery and air all beat the Chinese ground ball if you refuse a head-on fight."]},{"you":"*","enemy":"usa_laser","advice":["Everything Townes owns runs on power. Kill Cold Fusion Reactors and the Laser Turrets go dark, the lasers stop, and his base opens up.","His Point Defence Lasers shoot down rockets and missiles — bring shells, bullets and flame instead of a missile-only army.","Artillery out-ranges his defensive line. Siege him from outside the turret envelope rather than walking into it."]},{"you":"*","enemy":"usa_super","advice":["Alexander wins if the game goes long. Pressure her before the first Particle Cannon comes online — her opening is deliberately greedy.","Spread your base out. Clustered production is exactly what a Particle Cannon is priced for.","Kill the uplinks, not the army. Every destroyed Particle Cannon resets minutes of her plan."]},{"you":"*","enemy":"usa_air","advice":["Granger has no real tank line. A committed early ground push arrives before his second Airfield and he cannot answer it.","Mass anti-air rather than spreading it. Overlapping AA turns his aircraft from a threat into a donation.","His base defence is thin. Once you are inside it, you stay inside it."]},{"you":"*","enemy":"china_tank","advice":["Ta Hun Kwai has almost nothing that shoots upward. Aircraft are close to a free win if you get them out.","Rocket infantry in garrisons trade brutally well against his armour — a garrisoned building costs him tanks.","His tanks arrive veteran and early. Do not plan on winning the first ground engagement; plan on not taking it."]},{"you":"*","enemy":"china_infantry","advice":["Flame, toxin and area damage delete his hordes. Dragon Tanks, Inferno Cannons, Toxin Tractors, napalm and carpet bombing all convert his army into nothing.","Never fight his infantry with your own infantry — his start veteran and there are more of them.","Artillery is the cleanest answer. He has to close the distance and artillery does not let him."]},{"you":"*","enemy":"china_nuke","advice":["His tanks detonate when they die. Keep your army spread out or you will lose the fight you just won.","His nuclear reactors explode when destroyed — inside his own base. A single raid on his power does structural damage.","Engage at range. Every mechanic he has rewards you standing close to his units."]},{"you":"*","enemy":"gla_stealth","advice":["Bring detectors or you are not playing the game. USA: Sentry Drone. China: Listening Outpost, and Troop Crawlers in the army. GLA: Radar Van.","Assume any empty ground is occupied. Sweep suspected positions with area damage before you move through them.","Escort your vehicles. Kassad's Hijackers turn an unescorted tank into one of his tanks."]},{"you":"*","enemy":"gla_toxin","advice":["Go mechanised. Toxins do very little to vehicles and nothing at all to aircraft — an infantry army is a gift to Dr. Thrax.","Do not garrison buildings against him. Toxin Tractors clear a garrison faster than you can refill it.","Expect poisoned supply piles. Lingering toxin can stop your workers mining a pile you thought was safe."]},{"you":"*","enemy":"gla_demo","advice":["Nearly everything Juhziz owns has to touch you. Kill it on the approach and it never functions.","Long-range units and aircraft are close to immune to his whole arsenal.","Sweep for Demolition Traps before expanding. He buries them on exactly the supply pile you were about to take."]},{"you":"gla","enemy":"*","advice":["You have no aircraft. Quad Cannons and Stinger Sites are not optional — build them before the enemy shows you why.","Your buildings leave holes. Rebuilding is cheap: fight like your base is expendable, because it partly is."]},{"you":"usa","enemy":"*","advice":["Your units cost more than theirs. Every engagement you take should be one you chose.","Do not lose parked aircraft. An Airfield raid costs you more than any ground trade will."]},{"you":"china","enemy":"*","advice":["Keep five or more identical units together for the horde bonus — it is a free damage upgrade you are otherwise refusing.","Build a Listening Outpost early. It is the only cheap detection you have and stealth armies are common."]}],"provenance":{"curatedAt":"2026-09-16","wikiCache":{"fetchedAt":"2026-09-16T18:49:12.275Z","pages":283,"source":"cnc.fandom.com"},"lastIngest":{"attemptedAt":"2026-09-16T18:49:12.278Z","ok":true,"source":"cnc.fandom.com","pages":283,"matched":54,"curatedTotal":61,"costCorrections":25},"overlay":{"enriched":68,"rejected":201}}};
