<title>Battle Lineup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://static.wikia.nocookie.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">

<style>
  /*
    Single-theme by intent: this is an instrument panel, and the game it serves
    is a dark command console. Every colour is painted explicitly so the page
    holds on any host ground.
  */
  :root {
    color-scheme: dark;

    --ground:     #080B08;
    --ground-2:   #0E120D;
    --panel:      #151B14;
    --panel-2:    #1D251B;
    --panel-hi:   #27311F;

    --ink:        #E8EFE1;
    --ink-soft:   #A3B29A;
    --ink-faint:  #77876F;

    --line:       #2E3A29;
    --line-hot:   #46552F;

    --amber:      #F5B145;
    --amber-dim:  #B98330;
    --amber-glow: rgba(245, 177, 69, 0.16);

    /* Army colours, taken from the game's own faction palette. */
    --usa:        #5FAEF2;
    --china:      #F2584A;
    --gla:        #B9CE55;

    --crit:       #F26A54;
    --warn:       #F5B145;
    --ok:         #7FD183;

    --display: "Chakra Petch", "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", ui-sans-serif, system-ui, sans-serif;
    --hud: "Share Tech Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --chamfer: 10px;
  }

  * { box-sizing: border-box; }

  body {
    background:
      radial-gradient(120% 70% at 50% 0%, #141C12 0%, var(--ground) 62%),
      repeating-linear-gradient(0deg, rgba(120,150,110,0.030) 0 1px, transparent 1px 3px),
      var(--ground);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.55;
    margin: 0;
    padding-block: 0 4rem;
    padding-inline: 16px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .shell { max-width: 1320px; margin-inline: auto; }

  /* Chamfered corners: the signature RTS panel edge. */
  .cut {
    clip-path: polygon(
      var(--chamfer) 0, 100% 0, 100% calc(100% - var(--chamfer)),
      calc(100% - var(--chamfer)) 100%, 0 100%, 0 var(--chamfer));
  }

  /* ---------------------------------------------------------- masthead --- */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1.5rem;
    padding-block: 1.5rem 1rem;
    border-bottom: 1px solid var(--line-hot);
    margin-bottom: 1.5rem;
    position: relative;
  }
  .masthead::after {
    content: "";
    position: absolute;
    left: 0; bottom: -1px;
    width: clamp(90px, 22%, 240px); height: 3px;
    background: var(--amber);
  }
  .wordmark {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2.1rem, 7.5vw, 3.2rem);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1;
    margin: 0;
    color: var(--ink);
    text-shadow: 0 0 28px rgba(245, 177, 69, 0.18);
  }
  .wordmark span { color: var(--amber); }
  .masthead .sub {
    margin: 0.45rem 0 0;
    color: var(--ink-soft);
    font-family: var(--hud);
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .readiness { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .readout {
    font-family: var(--hud);
    font-size: 0.76rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 0.32rem 0.6rem;
    white-space: nowrap;
  }
  .readout b { color: var(--amber); font-weight: 400; }

  /* ------------------------------------------------------------ layout --- */
  .board {
    display: grid;
    grid-template-columns: 360px minmax(0, 1fr);
    gap: 1.6rem;
    align-items: start;
  }
  @media (max-width: 980px) {
    .board { grid-template-columns: minmax(0, 1fr); gap: 1.2rem; }
    .rail { position: static; }
  }

  .rail {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
    display: grid;
    gap: 0.9rem;
    min-width: 0;
  }

  /* ---------------------------------------------------------- controls --- */
  .console {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    padding: 0.8rem 0.85rem 0.9rem;
    min-width: 0;
  }
  .console > legend {
    font-family: var(--hud);
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--amber);
    padding: 0;
    margin: 0 0 0.6rem;
  }
  fieldset.console { border: 1px solid var(--line); margin: 0; }

  /* side tabs */
  .sides { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-bottom: 0.55rem; }
  .side-tab {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.86rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: 2px solid var(--tab, var(--line));
    padding: 0.48rem 0.15rem;
    min-height: 38px;
    cursor: pointer;
    transition: color 120ms ease, background 120ms ease;
  }
  .side-tab:hover { color: var(--ink); background: var(--panel-hi); }
  .side-tab[aria-selected="true"] {
    color: var(--ink);
    background: var(--panel-hi);
    border-bottom-color: var(--tab, var(--amber));
  }
  .side-tab:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }

  /* ---- army cards, now with the commander's face on them ---------------- */
  .armies { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
  .armies.is-wide { grid-template-columns: minmax(0, 1fr); }

  .army {
    position: relative;
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr);
    gap: 0.55rem;
    align-items: center;
    text-align: left;
    font: inherit;
    min-height: 62px;
    padding: 0.4rem 0.5rem 0.42rem 0.55rem;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px solid var(--line);
    cursor: pointer;
    overflow: hidden;
    transition: background 130ms ease, color 130ms ease, border-color 130ms ease, transform 130ms ease;
  }
  .army.is-any { grid-template-columns: minmax(0, 1fr); }
  .army::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--mark, var(--line-hot));
  }
  .army:hover {
    background: var(--panel-hi); color: var(--ink);
    border-color: var(--mark, var(--line-hot));
    transform: translateY(-1px);
  }
  .army[aria-pressed="true"] {
    background:
      linear-gradient(90deg, color-mix(in srgb, var(--mark) 18%, transparent), transparent 60%),
      var(--panel-hi);
    border-color: var(--mark, var(--amber));
    color: var(--ink);
    box-shadow: inset 0 0 22px -8px var(--mark);
  }
  .army[aria-pressed="true"]::after {
    content: "";
    position: absolute;
    right: -1px; top: -1px;
    border-width: 0 13px 13px 0;
    border-style: solid;
    border-color: transparent var(--mark, var(--amber)) transparent transparent;
  }
  .army:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }

  /* Commander portrait. Falls back to the faction mark when the crawl has no
     art for this army, so the grid never shows a broken frame. */
  .portrait {
    position: relative;
    width: 52px; height: 52px;
    flex: none;
    background: var(--ground-2);
    border: 1px solid var(--line);
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .portrait img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 22%;
    filter: saturate(0.85) contrast(1.06);
    transition: filter 130ms ease, transform 130ms ease;
  }
  .army:hover .portrait img,
  .army[aria-pressed="true"] .portrait img { filter: saturate(1.1) contrast(1.1); transform: scale(1.05); }
  .portrait svg { width: 24px; height: 24px; opacity: 0.6; }
  .portrait::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 45%, rgba(8,11,8,0.6));
    pointer-events: none;
  }

  /* Name over commander. Without this the two spans flow inline and read as
     "CHINAStandard doctrine". */
  .army-text { display: grid; gap: 0.02rem; min-width: 0; }
  .army-name {
    font-family: var(--display);
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 1.15;
    color: inherit;
  }
  .army[aria-pressed="true"] .army-name { color: var(--mark, var(--amber)); }
  .army-who { font-family: var(--hud); font-size: 0.72rem; letter-spacing: 0.02em; color: var(--ink-faint); }

  /* rank / difficulty */
  .ranks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; }
  .rank {
    display: grid;
    justify-items: center;
    gap: 0.1rem;
    font: inherit;
    min-height: 54px;
    padding: 0.4rem 0.1rem;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-faint);
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .rank:hover { background: var(--panel-hi); color: var(--ink); }
  .rank .stars { font-size: 0.82rem; letter-spacing: 0.04em; line-height: 1.2; }
  .rank .rank-label {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .rank[aria-pressed="true"] {
    background: var(--panel-hi); color: var(--ink);
    border-color: var(--tone, var(--amber));
    box-shadow: inset 0 0 18px -8px var(--tone);
  }
  .rank[aria-pressed="true"] .stars { color: var(--tone, var(--amber)); }
  .rank:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }

  select, .command-btn {
    width: 100%;
    font-family: var(--body);
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 0.55rem 0.6rem;
    min-height: 46px;
  }
  select:hover, .command-btn:hover { background: var(--panel-hi); border-color: var(--line-hot); }
  .command-btn {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.92rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    cursor: pointer;
  }
  .command-btn:hover { box-shadow: inset 0 0 22px -8px var(--amber); }
  select:focus-visible, .command-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }

  /* The theatre picker gets its own preview diagram underneath. */
  .theatre-preview { margin-top: 0.6rem; }
  .theatre-preview svg { width: 100%; height: auto; display: block; border: 1px solid var(--line); background: var(--ground-2); }
  .theatre-caption {
    font-family: var(--hud); font-size: 0.68rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint); margin-top: 0.3rem;
  }

  /* ---------------------------------------------------------- briefing --- */
  .briefing { display: grid; gap: 1.2rem; min-width: 0; }

  .dossier {
    position: relative;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line-hot);
    padding: 1.1rem 1.2rem 1.2rem;
    min-width: 0;
    overflow: hidden;
  }
  .dossier::before {
    content: "";
    position: absolute; inset: 0 0 auto 0; height: 2px;
    background: linear-gradient(90deg, var(--amber), transparent 70%);
  }
  .eva {
    font-family: var(--hud);
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--amber-dim);
    margin-bottom: 0.7rem;
  }
  .eva b { color: var(--amber); font-weight: 400; }

  /* ---- the VS plate: two commanders facing each other ------------------- */
  .combatants { display: grid; gap: 0.7rem; align-items: stretch; }
  @media (min-width: 680px) {
    .combatants { grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; }
  }
  .combatant {
    display: flex; align-items: center; gap: 0.85rem; min-width: 0;
    background: linear-gradient(90deg, color-mix(in srgb, var(--mark) 16%, transparent), transparent 75%);
    border: 1px solid color-mix(in srgb, var(--mark) 40%, var(--line));
    border-left: 3px solid var(--mark);
    padding: 0.6rem 0.75rem;
  }
  @media (min-width: 680px) {
    .combatant.them {
      flex-direction: row-reverse; text-align: right;
      border-left: 1px solid color-mix(in srgb, var(--mark) 40%, var(--line));
      border-right: 3px solid var(--mark);
      background: linear-gradient(270deg, color-mix(in srgb, var(--mark) 16%, transparent), transparent 75%);
    }
  }
  /* Big commander portrait on the briefing header. */
  .mugshot {
    position: relative;
    width: clamp(84px, 13vw, 116px);
    aspect-ratio: 1;
    flex: none;
    border: 1px solid color-mix(in srgb, var(--mark) 55%, var(--line));
    background: var(--ground-2);
    overflow: hidden;
    display: grid; place-items: center;
    box-shadow: 0 0 26px -10px var(--mark);
  }
  .mugshot img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center 20%;
    filter: saturate(1.05) contrast(1.08);
  }
  .mugshot svg { width: 38px; height: 38px; opacity: 0.7; }
  .mugshot::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, transparent 55%, rgba(8,11,8,0.65)),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  .combatant .who { min-width: 0; }
  .combatant .army-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.2rem, 3.8vw, 1.72rem);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.12;
    overflow-wrap: anywhere;
    color: var(--mark);
  }
  .combatant .cmdr { font-family: var(--hud); font-size: 0.78rem; color: var(--ink-soft); letter-spacing: 0.04em; }
  .combatant .role {
    font-family: var(--hud); font-size: 0.66rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .clash {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 0.18em;
    color: var(--amber);
    text-align: center;
    padding: 0.2rem 0.5rem;
    text-shadow: 0 0 18px var(--amber-glow);
  }

  .assessment {
    margin: 1rem 0 0;
    font-size: 1.12rem;
    line-height: 1.5;
    color: var(--ink);
    border-left: 3px solid var(--amber);
    padding-left: 0.85rem;
    text-wrap: pretty;
  }

  .conditions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.95rem; }
  .cond {
    font-family: var(--hud);
    font-size: 0.74rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid var(--line-hot);
    background: var(--panel);
    padding: 0.25rem 0.55rem;
    color: var(--ink-soft);
  }
  .cond.is-easy   { border-color: var(--ok);   color: var(--ok); }
  .cond.is-medium { border-color: var(--warn); color: var(--warn); }
  .cond.is-hard,
  .cond.is-brutal { border-color: var(--crit); color: var(--crit); }

  /* panels */
  section.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 0.95rem 1rem 1.05rem;
    min-width: 0;
  }
  .panel > h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.08rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .panel > h2::before {
    content: "";
    width: 8px; height: 8px;
    background: var(--amber);
    transform: rotate(45deg);
    flex: none;
  }
  .panel > h2 .count {
    font-family: var(--hud);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    margin-left: auto;
    text-transform: uppercase;
  }

  /* segmented threat meters, RTS power-bar style */
  .meters { display: grid; gap: 0.55rem; }
  .meter { display: grid; gap: 0.2rem 0.7rem; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  @media (min-width: 560px) { .meter { grid-template-columns: 10rem minmax(0, 1fr) 2.6rem; } }
  .meter-name {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.92rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .segs { display: flex; gap: 2px; grid-column: 1 / -1; }
  @media (min-width: 560px) { .segs { grid-column: auto; } }
  .segs i { flex: 1; height: 13px; background: var(--panel-hi); border: 1px solid var(--line); }
  .segs i.on { background: var(--ok); border-color: var(--ok); box-shadow: 0 0 10px -3px var(--ok); }
  .segs.warn i.on { background: var(--warn); border-color: var(--warn); box-shadow: 0 0 10px -3px var(--warn); }
  .segs.crit i.on { background: var(--crit); border-color: var(--crit); box-shadow: 0 0 10px -3px var(--crit); }
  .meter-val {
    font-family: var(--hud); font-size: 0.82rem; color: var(--ink-soft);
    text-align: right; font-variant-numeric: tabular-nums;
    justify-self: end;
  }

  /* build queue */
  ol.queue { list-style: none; counter-reset: q; margin: 0; padding: 0; display: grid; gap: 3px; }
  ol.queue li {
    counter-increment: q;
    display: grid;
    grid-template-columns: 2.3rem minmax(0, 1fr);
    gap: 0.7rem;
    align-items: start;
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 0.5rem 0.65rem;
    font-size: 1rem;
    color: var(--ink-soft);
  }
  ol.queue li::before {
    content: counter(q, decimal-leading-zero);
    font-family: var(--hud);
    font-size: 0.84rem;
    color: var(--amber-dim);
    background: var(--ground-2);
    border: 1px solid var(--line);
    text-align: center;
    line-height: 1.6;
    font-variant-numeric: tabular-nums;
  }
  ol.queue li.is-priority { border-color: var(--crit); background: rgba(242, 106, 84, 0.08); color: var(--ink); }
  ol.queue li.is-priority::before { color: var(--crit); border-color: var(--crit); }

  /* ---- countermeasures: requisition cards with unit art ----------------- */
  .counters { display: grid; gap: 0.75rem; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); }
  .counter {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-top: 3px solid var(--line-hot);
    padding: 0.7rem 0.8rem 0.8rem;
    display: grid;
    gap: 0.6rem;
    align-content: start;
    min-width: 0;
  }
  .counter.is-crit { border-top-color: var(--crit); }
  .counter.is-warn { border-top-color: var(--warn); }
  .counter-head { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
  .counter-head h3 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.02rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0;
    color: var(--ink);
  }
  .counter-head .pres {
    margin-left: auto; font-family: var(--hud); font-size: 0.76rem;
    color: var(--ink-soft); font-variant-numeric: tabular-nums;
  }

  .units { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .unit {
    display: grid;
    grid-template-columns: 80px minmax(0, 1fr);
    gap: 0.75rem;
    align-items: start;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 0.45rem 0.55rem;
    transition: border-color 130ms ease, background 130ms ease;
  }
  .unit:hover { border-color: var(--line-hot); background: var(--panel-hi); }

  /* Unit photograph. 54 of 61 units resolve to one; the rest fall back to the
     faction mark rather than leaving a hole in the grid. */
  .shot {
    position: relative;
    width: 80px; height: 62px;
    background: var(--ground-2);
    border: 1px solid var(--line);
    overflow: hidden;
    display: grid; place-items: center;
  }
  .shot img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: saturate(0.9) contrast(1.05);
    transition: transform 160ms ease, filter 160ms ease;
  }
  .unit:hover .shot img { transform: scale(1.07); filter: saturate(1.15) contrast(1.1); }
  .shot svg { width: 22px; height: 22px; opacity: 0.45; }
  .shot::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 55%, rgba(8,11,8,0.5));
    pointer-events: none;
  }

  .unit-body { display: grid; gap: 0.12rem; min-width: 0; }
  .unit-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 0.5rem; }
  .unit-name {
    font-family: var(--display); font-weight: 600; font-size: 1rem;
    letter-spacing: 0.04em; color: var(--ink);
  }
  .unit-cost { font-family: var(--hud); font-size: 0.82rem; color: var(--amber); font-variant-numeric: tabular-nums; }
  .unit-tier {

  }
  .unit-why { font-size: 0.95rem; color: var(--ink-soft); line-height: 1.42; }
  .counter-doctrine {
    font-size: 0.95rem; color: var(--ink-soft);
    border-top: 1px solid var(--line); padding-top: 0.55rem;
  }
  .counter-doctrine::before { content: "▸ "; color: var(--amber); }

  /* timeline */
  .phases { display: grid; gap: 0.7rem; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(245px, 100%), 1fr)); }
  .phase { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--amber); padding: 0.65rem 0.75rem; min-width: 0; }

  .phase li::before { content: "–"; position: absolute; left: 0; color: var(--ink-faint); }

  /* advice */
  .duo { display: grid; gap: 1.2rem; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
  ul.advice { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.55rem; }
  ul.advice li {
    display: grid; grid-template-columns: 1.3rem minmax(0, 1fr); gap: 0.5rem;
    font-size: 0.98rem; color: var(--ink-soft);
  }
  ul.advice li::before { content: "▸"; color: var(--amber); font-size: 0.8rem; line-height: 1.8; }
  ul.advice.is-danger li::before { content: "✕"; color: var(--crit); font-size: 0.82rem; }
  ul.advice.is-intel li::before { content: "!"; color: var(--warn); font-family: var(--hud); line-height: 1.7; }

  /* ---- lineup ranking, with a face per contender ------------------------ */
  .roster { display: grid; gap: 3px; margin-top: 0.7rem; }
  .roster-row {
    display: grid;
    grid-template-columns: 2.4rem 34px minmax(60px, 8rem) minmax(0, 1fr);
    gap: 0.6rem; align-items: center;

    padding: 0.2rem 0.25rem;

  }
  .roster-row.is-pick { border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); background: rgba(245,177,69,0.06); }
  .roster-score { font-family: var(--hud); font-size: 0.84rem; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
  .roster-face {
    width: 34px; height: 34px; border: 1px solid var(--line);
    background: var(--ground-2); overflow: hidden; display: grid; place-items: center;
  }
  .roster-face img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
  .roster-face svg { width: 17px; height: 17px; opacity: 0.55; }
  .roster-bar { height: 10px; background: var(--panel-hi); border: 1px solid var(--line); }
  .roster-bar > i { display: block; height: 100%; background: var(--line-hot); }
  .roster-name { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roster-row.is-pick .roster-name { color: var(--ink); font-weight: 600; }
  .roster-row.is-pick .roster-score { color: var(--amber); }
  .roster-row.is-pick .roster-bar > i { background: var(--amber); box-shadow: 0 0 12px -3px var(--amber); }

  .rationale { font-size: 0.98rem; color: var(--ink-soft); margin: 0 0 0.4rem; }

  /* ---- terrain panel: a drawn tactical diagram, not a photo ------------- */
  .terrain-split { display: grid; gap: 0.9rem; }
  @media (min-width: 640px) { .terrain-split { grid-template-columns: 300px minmax(0, 1fr); align-items: start; } }
  .terrain-art { border: 1px solid var(--line-hot); background: var(--ground-2); }
  .terrain-art svg { width: 100%; height: auto; display: block; }
  .terrain-legend {
    font-family: var(--hud); font-size: 0.7rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint);
    padding: 0.35rem 0.5rem; border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 0.15rem 0.8rem;
  }
  .terrain-legend b { color: var(--ink-soft); font-weight: 400; }

  /* colophon */
  .colophon {
    margin-top: 1.8rem;
    padding-top: 0.85rem;
    border-top: 1px solid var(--line);
    font-family: var(--hud);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);

  }
  .colophon a { color: var(--amber-dim); }

  @media (max-width: 460px) {
    .armies { grid-template-columns: minmax(0, 1fr); }
    .ranks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .roster-row { grid-template-columns: 2.2rem 28px minmax(0, 1fr); }
    .roster-bar { display: none; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .dossier::before { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<script>
/*__ENGINE__*/

const DATA = /*__DATASET__*/;

const SIDES = ['usa', 'china', 'gla'];
const SIDE_COLOR = { usa: 'var(--usa)', china: 'var(--china)', gla: 'var(--gla)' };
const SIDE_LABEL = { usa: 'USA', china: 'China', gla: 'GLA' };

/* Abstract faction marks — geometry, not insignia. Used wherever the wiki crawl
   has no photograph, so an absent image degrades to a symbol, never a gap. */
const MARKS = {
  usa: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.2 6.6.9-4.8 4.7 1.2 6.7L12 17.3 6.1 20.5l1.2-6.7L2.5 9.1l6.6-.9z" fill="currentColor"/></svg>',
  china: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8.7 5v10L12 22 3.3 17V7z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.4" fill="currentColor"/></svg>',
  gla: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5L22 20H2z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9l4.8 8.4H7.2z" fill="currentColor"/></svg>',
};

const RANKS = [
  { id: 'easy',   label: 'Recruit',   stars: 1, tone: 'var(--ok)' },
  { id: 'medium', label: 'Veteran',   stars: 2, tone: 'var(--warn)' },
  { id: 'hard',   label: 'Elite',     stars: 3, tone: 'var(--crit)' },
  { id: 'brutal', label: 'Heroic',    stars: 4, tone: 'var(--crit)' },
];

/* Section names in the game's own register. */
const SECTION = {
  roster: 'General selection',
  intel: 'Enemy threat assessment',
  queue: 'Build queue',
  counters: 'Countermeasures',
  timeline: 'Operational timeline',
  doctrine: 'Enemy doctrine',
  rules: 'Rules of engagement',
  field: 'Field notes',
  terrain: 'Terrain analysis',
};

const state = {
  you: null,
  enemy: 'china_tank',
  difficulty: 'hard',
  mapId: null,
  seed: 20030922,          // Zero Hour's release date
  youSide: null,
  enemySide: 'china',
};

const $ = (id) => document.getElementById(id);
const el = (tag, className, text) => {
  const n = document.createElement(tag);
  if (className) n.className = className;
  if (text !== undefined) n.textContent = text;
  return n;
};
const mark = (side, size) => {
  const holder = el('span');
  holder.innerHTML = MARKS[side] ?? MARKS.usa;   // static strings defined above
  const svg = holder.firstChild;
  svg.style.color = SIDE_COLOR[side] ?? 'var(--amber)';   // currentColor source
  if (size) { svg.setAttribute('width', size); svg.setAttribute('height', size); }
  return svg;
};

/* The engine's counter list carries only name/cost/tier/why, so art is looked
   up from the dataset by name rather than threaded through the engine — the
   engine has no business knowing about pictures. */
const UNIT_ART = new Map(DATA.units.map((u) => [u.name.toLowerCase(), u]));

/**
 * An image frame that degrades instead of breaking.
 *
 * The art is hotlinked from the wiki, so any given URL can fail at load time —
 * a renamed file, a blocked host, an offline viewer. On error the <img> is
 * discarded and the faction mark takes its place, which is also what happens
 * for the seven units and the maps the crawl has no art for.
 */
function frame(className, src, side, alt) {
  const box = el('div', className);
  const fallback = () => {
    box.replaceChildren(mark(side));
    box.dataset.art = 'mark';
  };
  if (!src) { fallback(); return box; }

  const img = el('img');
  img.src = src;
  img.alt = alt ?? '';
  img.loading = 'lazy';
  img.decoding = 'async';
  img.referrerPolicy = 'no-referrer';
  img.addEventListener('error', fallback, { once: true });
  box.append(img);
  box.dataset.art = 'photo';
  return box;
}

/** "USA Air Force General" -> "Air Force"; base factions get their short name. */
const SHORT = {
  usa: 'USA', china: 'China', gla: 'GLA',
};
function armyName(f) {
  if (SHORT[f.id]) return SHORT[f.id];
  return f.name.replace(/^(USA|China|GLA)\s+/, '').replace(/\s+General$/, '');
}
function commander(f) {
  if (!f.general) return 'Standard doctrine';
  return f.general.replace(/^(Gen\.|Dr\.|Prince)\s+/, '');
}

/* ------------------------------------------------- generated map art ---- */

/* Deterministic per-map layout: the same theatre always draws the same
   diagram. mulberry32 comes from the engine bundle. */
function seedOf(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

const TERRAIN_INK = {
  desert:    { base: '#3E3524', ridge: '#5A4A2C' },
  snow:      { base: '#333B42', ridge: '#4B565E' },
  urban:     { base: '#2F3335', ridge: '#454B4E' },
  temperate: { base: '#28331F', ridge: '#3C4B2E' },
  jungle:    { base: '#1F2E1B', ridge: '#314727' },
  mixed:     { base: '#2C3327', ridge: '#424C3A' },
};

const svgEl = (name, attrs) => {
  const n = document.createElementNS('http://www.w3.org/2000/svg', name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
  return n;
};

/**
 * Draw a theatre as a tactical diagram.
 *
 * cnc.fandom.com has no per-map article — every map title redirects to one
 * shared list page, and the wiki holds three map previews in total. Rather than
 * show a photograph for one map and nothing for the other fifteen, each map is
 * drawn from the ratings the planner actually reasons about: chokepoints,
 * supply density, openness and the start count.
 */
function mapDiagram(map) {
  const W = 300, H = 190;
  const ink = TERRAIN_INK[map.terrain] ?? TERRAIN_INK.mixed;
  const rand = mulberry32(seedOf(map.id));

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });
  const title = svgEl('title', {});
  title.textContent = `${map.name}: ${map.players} starts, ${map.terrain} terrain`;
  svg.append(title);

  svg.append(svgEl('rect', { x: 0, y: 0, width: W, height: H, fill: ink.base }));

  // Terrain relief: soft blobs, denser where the map is less open.
  const blobs = 5 + Math.round((3 - map.openness) * 3);
  for (let i = 0; i < blobs; i++) {
    svg.append(svgEl('ellipse', {
      cx: rand() * W, cy: rand() * H,
      rx: 18 + rand() * 46, ry: 12 + rand() * 30,
      fill: ink.ridge, opacity: (0.22 + rand() * 0.28).toFixed(2),
    }));
  }

  // Tactical grid.
  for (let x = 30; x < W; x += 30) {
    svg.append(svgEl('line', { x1: x, y1: 0, x2: x, y2: H, stroke: '#7E8F76', 'stroke-width': 0.4, opacity: 0.16 }));
  }
  for (let y = 30; y < H; y += 30) {
    svg.append(svgEl('line', { x1: 0, y1: y, x2: W, y2: y, stroke: '#7E8F76', 'stroke-width': 0.4, opacity: 0.16 }));
  }

  // Chokepoints: opposing wedges pinching a lane. One pair per rating point.
  for (let i = 0; i < map.chokepoints; i++) {
    const y = H * ((i + 1) / (map.chokepoints + 1));
    const x = 60 + rand() * (W - 140);
    const gap = 16 + rand() * 10;
    svg.append(svgEl('path', {
      d: `M${x - 26} ${y - 46} L${x + 26} ${y - 46} L${x} ${y - gap} Z`,
      fill: ink.ridge, opacity: 0.85, stroke: '#8FA083', 'stroke-width': 0.6,
    }));
    svg.append(svgEl('path', {
      d: `M${x - 26} ${y + 46} L${x + 26} ${y + 46} L${x} ${y + gap} Z`,
      fill: ink.ridge, opacity: 0.85, stroke: '#8FA083', 'stroke-width': 0.6,
    }));
  }

  // Supply: one cluster per density point, each a few crates.
  for (let i = 0; i < map.supplyDensity * 2 + 1; i++) {
    const cx = 24 + rand() * (W - 48);
    const cy = 24 + rand() * (H - 48);
    for (let c = 0; c < 3; c++) {
      svg.append(svgEl('rect', {
        x: cx + (c % 2) * 7 - 3, y: cy + Math.floor(c / 2) * 7 - 3,
        width: 5.5, height: 5.5, fill: '#E3C558', opacity: 0.9,
      }));
    }
  }

  // Start positions, ringed around the playable area.
  for (let i = 0; i < map.players; i++) {
    const a = (i / map.players) * Math.PI * 2 - Math.PI / 2;
    const cx = W / 2 + Math.cos(a) * (W * 0.34);
    const cy = H / 2 + Math.sin(a) * (H * 0.33);
    svg.append(svgEl('circle', { cx, cy, r: 9, fill: 'none', stroke: '#F5B145', 'stroke-width': 1.6, opacity: 0.95 }));
    svg.append(svgEl('circle', { cx, cy, r: 3, fill: '#F5B145' }));
  }

  svg.append(svgEl('rect', { x: 0.5, y: 0.5, width: W - 1, height: H - 1, fill: 'none', stroke: '#46552F', 'stroke-width': 1 }));
  return svg;
}

function terrainCard(map) {
  const box = el('div', 'terrain-art');
  box.append(mapDiagram(map));
  const legend = el('div', 'terrain-legend');
  for (const [k, v] of [
    ['Starts', map.players], ['Choke', `${map.chokepoints}/3`],
    ['Supply', `${map.supplyDensity}/3`], ['Open', `${map.openness}/3`],
  ]) {
    const span = el('span');
    span.append(document.createTextNode(k + ' '));
    span.append(el('b', null, String(v)));
    legend.append(span);
  }
  box.append(legend);
  return box;
}

/* ---------------------------------------------------------- controls --- */

function sideTabs(container, currentSide, onSide) {
  container.replaceChildren();
  const tabs = [{ id: null, label: 'Any' }, ...SIDES.map((s) => ({ id: s, label: SIDE_LABEL[s] }))];
  for (const t of tabs) {
    const btn = el('button', 'side-tab', t.label);
    btn.type = 'button';
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', String(currentSide === t.id));
    if (t.id) btn.style.setProperty('--tab', SIDE_COLOR[t.id]);
    btn.addEventListener('click', () => onSide(t.id));
    container.append(btn);
  }
}

function armyCards(container, side, selected, onPick, anyLabel, anyHint) {
  container.replaceChildren();
  container.classList.toggle('is-wide', side === null);

  if (side === null) {
    const btn = el('button', 'army is-any');
    btn.type = 'button';
    btn.style.setProperty('--mark', 'var(--amber)');
    btn.setAttribute('aria-pressed', String(selected === null));
    const body = el('span', 'army-text');
    body.append(el('span', 'army-name', anyLabel));
    body.append(el('span', 'army-who', anyHint));
    btn.append(body);
    btn.addEventListener('click', () => onPick(null));
    container.append(btn);
    return;
  }

  for (const f of DATA.factions.filter((x) => x.side === side)) {
    const btn = el('button', 'army');
    btn.type = 'button';
    btn.style.setProperty('--mark', SIDE_COLOR[side]);
    btn.setAttribute('aria-pressed', String(selected === f.id));
    btn.title = f.tagline;
    btn.append(frame('portrait', f.image, f.side, ''));
    const body = el('span', 'army-text');
    body.append(el('span', 'army-name', armyName(f)));
    body.append(el('span', 'army-who', commander(f)));
    btn.append(body);
    btn.addEventListener('click', () => onPick(f.id));
    container.append(btn);
  }
}

function rankButtons() {
  const box = $('ranks');
  box.replaceChildren();
  for (const r of RANKS) {
    const btn = el('button', 'rank');
    btn.type = 'button';
    btn.style.setProperty('--tone', r.tone);
    btn.setAttribute('aria-pressed', String(state.difficulty === r.id));
    btn.setAttribute('aria-label', `${r.id} difficulty`);
    btn.append(el('span', 'stars', '★'.repeat(r.stars)));
    btn.append(el('span', 'rank-label', r.id));
    btn.addEventListener('click', () => { state.difficulty = r.id; render(); });
    box.append(btn);
  }
}

function mapSelect() {
  const sel = $('map-select');
  sel.replaceChildren();
  const any = el('option', null, 'Unspecified theatre');
  any.value = '';
  sel.append(any);
  for (const m of [...DATA.maps].sort((a, b) => a.players - b.players || a.name.localeCompare(b.name))) {
    const opt = el('option', null, `${m.name} — ${m.players} players, ${m.terrain}`);
    opt.value = m.id;
    sel.append(opt);
  }
  sel.value = state.mapId ?? '';
  sel.addEventListener('change', () => { state.mapId = sel.value || null; render(); });
}

/** Live diagram under the theatre picker, so the choice has a face. */
function theatrePreview() {
  const box = $('theatre-preview');
  const map = DATA.maps.find((m) => m.id === state.mapId);
  if (!map) { box.replaceChildren(); return; }
  box.replaceChildren(mapDiagram(map), el('div', 'theatre-caption', `${map.name} · ${map.terrain}`));
}

/* ---------------------------------------------------------- briefing --- */

const toneOf = (v) => (v >= 2.4 ? 'crit' : v >= 1.6 ? 'warn' : '');

function panel(title, count) {
  const s = el('section', 'panel');
  const h = el('h2');
  h.append(document.createTextNode(title));
  if (count) h.append(el('span', 'count', count));
  s.append(h);
  return s;
}

function advice(items, variant) {
  const ul = el('ul', 'advice' + (variant ? ' ' + variant : ''));
  for (const i of items) ul.append(el('li', null, i));
  return ul;
}

function combatant(faction, role) {
  const box = el('div', 'combatant ' + role);
  box.style.setProperty('--mark', SIDE_COLOR[faction.side] ?? 'var(--amber)');
  box.append(frame('mugshot', faction.image, faction.side, faction.general ?? faction.name));
  const who = el('div', 'who');
  who.append(el('div', 'role', role === 'you' ? 'Your command' : 'Hostile force'));
  who.append(el('div', 'army-title', faction.name));
  who.append(el('div', 'cmdr', faction.general ?? 'Standard doctrine'));
  box.append(who);
  return box;
}

function renderDossier(plan) {
  const box = el('div', 'dossier cut');

  const eva = el('div', 'eva');
  eva.append(document.createTextNode('▸ Battle plan established — '));
  eva.append(el('b', null, plan.you.name));
  eva.append(document.createTextNode(' deployed'));
  box.append(eva);

  const row = el('div', 'combatants');
  row.append(combatant(plan.you, 'you'));
  row.append(el('div', 'clash', 'VS'));
  row.append(combatant(plan.enemy, 'them'));
  box.append(row);

  box.append(el('p', 'assessment', plan.headline));

  const conds = el('div', 'conditions');
  conds.append(el('span', `cond is-${plan.difficulty}`, `Rank: ${plan.difficulty}`));
  conds.append(el('span', 'cond', plan.map ? plan.map.name : 'Any theatre'));
  if (plan.map) {
    conds.append(el('span', 'cond', `${plan.map.players} players`));
    conds.append(el('span', 'cond', `${plan.map.terrain} terrain`));
    conds.append(el('span', 'cond', `Chokepoints ${plan.map.chokepoints}/3`));
    conds.append(el('span', 'cond', `Supply ${plan.map.supplyDensity}/3`));
  }
  box.append(conds);
  return box;
}

function renderRoster(plan) {
  if (!plan.lineupRationale) return null;
  const s = panel(SECTION.roster, 'scored vs their doctrine');
  for (const line of plan.lineupRationale) s.append(el('p', 'rationale', line));

  const list = el('div', 'roster');
  const top = plan.lineupRanking.slice(0, 6);
  const max = Math.max(1, ...top.map((r) => r.score));
  for (const r of top) {
    const row = el('div', 'roster-row' + (r.faction.id === plan.you.id ? ' is-pick' : ''));
    row.append(el('div', 'roster-score', String(r.score)));
    row.append(frame('roster-face', r.faction.image, r.faction.side, ''));
    const bar = el('div', 'roster-bar');
    const fill = el('i');
    fill.style.width = `${(r.score / max) * 100}%`;
    bar.append(fill);
    row.append(bar);
    row.append(el('div', 'roster-name', r.faction.name));
    list.append(row);
  }
  s.append(list);
  return s;
}

function renderIntel(plan) {
  const s = panel(SECTION.intel, 'pressure by axis');
  const meters = el('div', 'meters');
  for (const c of plan.counters) {
    const row = el('div', 'meter');
    row.append(el('div', 'meter-name', AXIS_LABEL[c.axis]));
    const segs = el('div', 'segs ' + toneOf(c.pressure));
    const lit = Math.round((Math.min(3, c.pressure) / 3) * 10);
    for (let i = 0; i < 10; i++) segs.append(el('i', i < lit ? 'on' : null));
    row.append(segs);
    row.append(el('div', 'meter-val', c.pressure.toFixed(1)));
    meters.append(row);
  }
  s.append(meters);
  return s;
}

function renderQueue(plan) {
  const s = panel(SECTION.queue, `${plan.buildOrder.length} orders`);
  const ol = el('ol', 'queue');
  for (const step of plan.buildOrder) {
    const li = el('li');
    if (/^PRIORITY/.test(step) || /mandatory/i.test(step)) li.className = 'is-priority';
    li.append(el('span', null, step));
    ol.append(li);
  }
  s.append(ol);
  return s;
}

function renderCounters(plan) {
  const s = panel(SECTION.counters, 'requisition list');
  const grid = el('div', 'counters');
  for (const c of plan.counters) {
    const tone = toneOf(c.pressure);
    const card = el('div', 'counter' + (tone ? ' is-' + tone : ''));
    const head = el('div', 'counter-head');
    head.append(el('h3', null, AXIS_LABEL[c.axis]));
    head.append(el('span', 'pres', `${c.pressure.toFixed(1)}/3`));
    card.append(head);

    const ul = el('ul', 'units');
    for (const u of c.units) {
      const record = UNIT_ART.get(u.name.toLowerCase());
      const li = el('li', 'unit');
      li.append(frame('shot', record && record.image, plan.you.side, u.name));
      const body = el('div', 'unit-body');
      const line = el('div', 'unit-line');
      line.append(el('span', 'unit-name', u.name));
      line.append(el('span', 'unit-cost', `$${u.cost.toLocaleString()}`));
      line.append(el('span', 'unit-tier', u.tier === 'early' ? 'Tier 1' : u.tier === 'mid' ? 'Tier 2' : 'Tier 3'));
      body.append(line);
      body.append(el('div', 'unit-why', u.why));
      li.append(body);
      ul.append(li);
    }
    card.append(ul);
    card.append(el('div', 'counter-doctrine', c.guidance));
    grid.append(card);
  }
  s.append(grid);
  return s;
}

function renderTimeline(plan) {
  const s = panel(SECTION.timeline, 'mission clock');
  const box = el('div', 'phases');
  for (const p of plan.timeline) {
    const card = el('div', 'phase');
    card.append(el('h3', null, p.label));
    card.append(el('span', 'window', p.window));
    const ul = el('ul');
    for (const o of p.objectives) ul.append(el('li', null, o));
    card.append(ul);
    box.append(card);
  }
  s.append(box);
  return s;
}

function renderTerrain(plan) {
  const s = panel(plan.map ? `${SECTION.terrain} — ${plan.map.name}` : SECTION.terrain);
  const split = el('div', 'terrain-split');
  if (plan.map) split.append(terrainCard(plan.map));

  const right = el('div');
  right.append(advice(plan.mapNotes));
  if (plan.map && plan.map.features.length) {
    const tags = el('div', 'conditions');
    for (const f of plan.map.features) tags.append(el('span', 'cond', f));
    right.append(tags);
  }
  split.append(right);
  s.append(split);
  return s;
}

/* -------------------------------------------------------------- render --- */

function renderControls() {
  sideTabs($('you-sides'), state.youSide, (s) => {
    state.youSide = s;
    if (s === null) state.you = null;
    render();
  });
  armyCards($('you-armies'), state.youSide, state.you, (id) => { state.you = id; render(); },
    'Let the planner choose', 'Best answer to their doctrine');

  sideTabs($('enemy-sides'), state.enemySide, (s) => {
    state.enemySide = s;
    if (s === null) state.enemy = null;
    render();
  });
  armyCards($('enemy-armies'), state.enemySide, state.enemy, (id) => { state.enemy = id; render(); },
    'Unknown hostile', 'Draw an opponent at random');

  rankButtons();
  $('map-select').value = state.mapId ?? '';
  theatrePreview();
}

function render() {
  // Controls are drawn first and unconditionally. When a plan fails, the user
  // needs the selectors more than ever — an earlier version returned early and
  // left the whole console blank, with no way to change the selection.
  renderControls();

  let plan;
  try {
    plan = planFrom(DATA, {
      you: state.you ?? undefined,
      enemy: state.enemy ?? undefined,
      difficulty: state.difficulty,
      mapId: state.mapId ?? undefined,
      seed: state.seed,
    });
  } catch (err) {
    const box = panel('Command error');
    box.append(el('p', 'rationale', 'No battle plan could be established for this selection.'));
    box.append(el('p', 'rationale', String(err && err.message ? err.message : err)));
    box.append(el('p', 'rationale', 'Pick a different army or theatre on the left to continue.'));
    $('briefing').replaceChildren(box);
    return;
  }

  const parts = [renderDossier(plan), renderRoster(plan), renderIntel(plan), renderQueue(plan), renderCounters(plan), renderTimeline(plan)]
    .filter(Boolean);

  const duo = el('div', 'duo');
  const doctrine = panel(SECTION.doctrine);
  doctrine.append(advice(plan.watchFor, 'is-intel'));
  const rules = panel(SECTION.rules);
  rules.append(advice(plan.doNot, 'is-danger'));
  duo.append(doctrine, rules);
  parts.push(duo);

  if (plan.matchupNotes.length) {
    const notes = panel(SECTION.field, `${plan.matchupNotes.length} applicable`);
    notes.append(advice(plan.matchupNotes));
    parts.push(notes);
  }

  parts.push(renderTerrain(plan));

  $('briefing').replaceChildren(...parts);
}

/* ---------------------------------------------------------------- boot --- */

/**
 * Say precisely where the data came from. "No overlay" previously meant both
 * "the crawl was refused" and "no crawl ever ran"; the ingest now records which.
 */
function dataSource() {
  const p = DATA.provenance;
  const ing = p.lastIngest;
  if (p.wikiCache) {
    const recon = ing && ing.matched != null ? ` · ${ing.matched}/${ing.curatedTotal} units reconciled` : '';
    // A crawl that ignored far more than it merged is scoped wrong, and that
    // should be visible on the page rather than buried in a build log.
    const ov = p.overlay;
    const ignored = ov && ov.rejected ? ` · ${ov.enriched} enriched, ${ov.rejected} ignored (not Generals)` : '';
    const poor = ov && ov.rejected > ov.enriched * 4;
    return {
      chip: poor ? 'Wiki ⚠' : 'Wiki ✓',
      tone: poor ? 'var(--warn)' : 'var(--ok)',
      line: `Wiki overlay · ${p.wikiCache.pages} pages from ${p.wikiCache.source} · ${p.wikiCache.fetchedAt.slice(0, 10)}${recon}${ignored}`,
    };
  }
  if (ing && !ing.ok) {
    return {
      chip: 'Curated',
      tone: 'var(--warn)',
      line: `Wiki crawl ${ing.attemptedAt.slice(0, 10)} failed — ${ing.error} · serving curated data`,
    };
  }
  return {
    chip: 'Curated',
    tone: 'var(--ink-soft)',
    line: 'No wiki crawl recorded · serving curated data',
  };
}

const src = dataSource();
const withArt = DATA.units.filter((u) => u.image).length;
const readiness = $('readiness');
readiness.replaceChildren(
  ...[['Armies', DATA.factions.length], ['Units', DATA.units.length], ['Theatres', DATA.maps.length], ['Art', withArt]]
    .map(([label, n]) => {
      const box = el('span', 'readout');
      box.append(document.createTextNode(label + ' '));
      box.append(el('b', null, String(n)));
      return box;
    }),
);
const dataChip = el('span', 'readout');
dataChip.style.borderColor = src.tone;
dataChip.append(document.createTextNode('Data '));
const chipVal = el('b', null, src.chip);
chipVal.style.color = src.tone;
dataChip.append(chipVal);
dataChip.title = src.line;
readiness.append(dataChip);

$('reroll').addEventListener('click', () => {
  state.seed = Math.floor(Math.random() * 1e9);
  render();
});

$('colophon').replaceChildren(
  el('span', null, `Curated dossier ${DATA.provenance.curatedAt} · strategy engine runs in this page`),
  el('span', null, src.line),
  el('span', null, 'Unit and commander art is hotlinked from the Command & Conquer Wiki; map diagrams are drawn from the authored ratings'),
  el('span', null, 'Fan-made planning tool · not affiliated with Electronic Arts'),
);

mapSelect();
render();
</script>
