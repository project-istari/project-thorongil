<title>Battle Lineup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  :root {
    --ground:    #EBE7D9;
    --surface:   #F7F4EC;
    --surface-2: #E1DBC8;
    --ink:       #1E2018;
    --ink-soft:  #55584A;
    --ink-faint: #82856F;
    --line:      #C7C1AB;
    --line-soft: #DBD5C2;
    --accent:    #A85B18;
    --accent-2:  #8A4B14;
    --usa:       #3F6E9E;
    --china:     #A93226;
    --gla:       #6B7830;
    --crit:      #A8382C;
    --warn:      #B27E1B;
    --ok:        #55784A;

    --step--1: 0.78rem;
    --step-0:  0.95rem;
    --step-1:  1.15rem;
    --step-2:  1.55rem;
    --step-3:  2.3rem;

    --display: "Barlow Condensed", "Oswald", "Arial Narrow", sans-serif;
    --body: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:    #14160E;
      --surface:   #1C1F15;
      --surface-2: #262A1C;
      --ink:       #E9E5D5;
      --ink-soft:  #A2A48E;
      --ink-faint: #7C7F6A;
      --line:      #383D2A;
      --line-soft: #2B3020;
      --accent:    #DE9142;
      --accent-2:  #EFB673;
      --usa:       #77A3CD;
      --china:     #DB6A60;
      --gla:       #A7B55A;
      --crit:      #DB6A60;
      --warn:      #E0B04A;
      --ok:        #8FB87F;
    }
  }

  :root[data-theme="dark"] {
    --ground:    #14160E;
    --surface:   #1C1F15;
    --surface-2: #262A1C;
    --ink:       #E9E5D5;
    --ink-soft:  #A2A48E;
    --ink-faint: #7C7F6A;
    --line:      #383D2A;
    --line-soft: #2B3020;
    --accent:    #DE9142;
    --accent-2:  #EFB673;
    --usa:       #77A3CD;
    --china:     #DB6A60;
    --gla:       #A7B55A;
    --crit:      #DB6A60;
    --warn:      #E0B04A;
    --ok:        #8FB87F;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: var(--step-0);
    line-height: 1.55;
    margin: 0;
    padding-block: 0 3rem;
    padding-inline: 16px;
    -webkit-font-smoothing: antialiased;
  }

  .shell { max-width: 1180px; margin-inline: auto; }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 0.75rem 1.5rem;
    padding-block: 1.6rem 1rem;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 1.5rem;
  }
  .wordmark {
    font-family: var(--display);
    font-weight: 700;
    font-size: var(--step-3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 0.95;
    margin: 0;
  }
  .wordmark span { color: var(--accent); }
  .masthead p {
    margin: 0.15rem 0 0;
    color: var(--ink-soft);
    font-size: var(--step--1);
    letter-spacing: 0.02em;
  }
  .stamp {
    font-family: var(--mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-faint);
    border: 1px solid var(--line);
    padding: 0.3rem 0.55rem;
    white-space: nowrap;
  }

  /* ---------- layout ---------- */
  .board {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 2rem;
    align-items: start;
  }
  @media (max-width: 860px) {
    .board { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
    .rail { position: static; }
  }

  .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 1rem); display: grid; gap: 1.4rem; }

  /* ---------- controls ---------- */
  .field > legend,
  .eyebrow {
    font-family: var(--mono);
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 0;
    margin-bottom: 0.5rem;
  }
  .field { border: 0; padding: 0; margin: 0; }

  .side-group + .side-group { margin-top: 0.5rem; }
  .side-label {
    font-family: var(--mono);
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    color: var(--ink-faint);
    margin-bottom: 0.25rem;
  }

  .chips { display: grid; gap: 3px; }

  .chip {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
    text-align: left;
    font: inherit;
    font-size: var(--step--1);
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-left: 3px solid var(--sidecolor, var(--line));
    padding: 0.28rem 0.5rem;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .chip:hover { background: var(--surface-2); color: var(--ink); }
  .chip[aria-pressed="true"] {
    background: var(--ink);
    color: var(--ground);
    border-color: var(--ink);
    border-left-color: var(--sidecolor, var(--accent));
    font-weight: 600;
  }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip .chip-sub { margin-left: auto; font-family: var(--mono); font-size: 0.62rem; opacity: 0.65; }

  .chip-any { --sidecolor: var(--accent); font-style: italic; }

  .segmented { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .seg {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line-soft);
    padding: 0.4rem 0.2rem;
    cursor: pointer;
  }
  .seg:hover { background: var(--surface-2); color: var(--ink); }
  .seg[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .seg:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

  select, .ghost-btn {
    width: 100%;
    font: inherit;
    font-size: var(--step--1);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 0.4rem 0.5rem;
  }
  .ghost-btn {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .ghost-btn:hover { background: var(--surface-2); color: var(--ink); }
  select:focus-visible, .ghost-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- briefing ---------- */
  .briefing { display: grid; gap: 1.75rem; min-width: 0; }

  .matchup {
    border: 1px solid var(--line);
    border-top: 3px solid var(--accent);
    background: var(--surface);
    padding: 1.1rem 1.2rem;
  }
  .versus {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.4rem 0.8rem;
    font-family: var(--display);
    font-size: var(--step-2);
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.1;
    text-wrap: balance;
  }
  .versus .vs { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.2em; color: var(--ink-faint); text-transform: uppercase; }
  .army-you { color: var(--accent-2); }
  .army-them { color: var(--crit); }
  .commanders {
    display: flex; flex-wrap: wrap; gap: 0.2rem 1.2rem;
    font-size: var(--step--1); color: var(--ink-soft); margin-top: 0.35rem;
  }
  .commanders b { font-weight: 600; color: var(--ink); }
  .headline { margin: 0.8rem 0 0; font-size: var(--step-1); line-height: 1.4; text-wrap: balance; }

  .conditions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.8rem; }
  .tag {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid var(--line);
    padding: 0.2rem 0.45rem;
    color: var(--ink-soft);
  }
  .tag-diff-easy   { border-color: var(--ok);    color: var(--ok); }
  .tag-diff-medium { border-color: var(--warn);  color: var(--warn); }
  .tag-diff-hard,
  .tag-diff-brutal { border-color: var(--crit);  color: var(--crit); }

  section.panel { min-width: 0; }
  .panel > h2 {
    font-family: var(--display);
    font-weight: 600;
    font-size: var(--step-1);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0 0 0.7rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
  }
  .panel > h2 .count {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    margin-left: auto;
  }

  /* threat meters */
  .meters { display: grid; gap: 0.4rem; }
  .meter { display: grid; grid-template-columns: minmax(96px, 8.5rem) minmax(0, 1fr) 2.4rem; gap: 0.6rem; align-items: center; }
  .meter-name { font-size: var(--step--1); color: var(--ink-soft); }
  .meter-track { height: 8px; background: var(--surface-2); border: 1px solid var(--line-soft); }
  .meter-fill { height: 100%; background: var(--ok); }
  .meter-fill.is-warn { background: var(--warn); }
  .meter-fill.is-crit { background: var(--crit); }
  .meter-val { font-family: var(--mono); font-size: 0.7rem; color: var(--ink-faint); text-align: right; font-variant-numeric: tabular-nums; }

  /* build order */
  ol.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; display: grid; gap: 0.35rem; }
  ol.steps li {
    counter-increment: step;
    display: grid;
    grid-template-columns: 1.8rem minmax(0, 1fr);
    gap: 0.5rem;
    align-items: baseline;
    padding: 0.35rem 0;
    border-bottom: 1px dashed var(--line-soft);
  }
  ol.steps li::before {
    content: counter(step, decimal-leading-zero);
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  ol.steps li.is-priority { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  ol.steps li.is-priority::before { color: var(--crit); }

  /* counters */
  .counter-grid { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); }
  .counter {
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 0.7rem 0.8rem;
    display: grid;
    gap: 0.5rem;
    align-content: start;
  }
  .counter-head { display: flex; align-items: baseline; gap: 0.5rem; }
  .counter-head h3 {
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 0;
  }
  .counter-head .pressure { margin-left: auto; font-family: var(--mono); font-size: 0.68rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .units { display: grid; gap: 0.4rem; margin: 0; padding: 0; list-style: none; }
  .unit { display: grid; gap: 0.1rem; }
  .unit-name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem; font-weight: 600; font-size: var(--step--1); }
  .unit-cost { font-family: var(--mono); font-size: 0.65rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .unit-tier { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
  .unit-why { font-size: var(--step--1); color: var(--ink-soft); line-height: 1.4; }
  .counter-guide { font-size: var(--step--1); color: var(--ink-soft); border-top: 1px dashed var(--line-soft); padding-top: 0.45rem; font-style: italic; }

  /* timeline */
  .phases { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .phase { border-left: 2px solid var(--accent); padding-left: 0.7rem; }
  .phase h3 { font-family: var(--display); font-weight: 600; font-size: 1.05rem; letter-spacing: 0.06em; text-transform: uppercase; margin: 0; }
  .phase .window { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-faint); display: block; margin-bottom: 0.35rem; }
  .phase ul { margin: 0; padding-left: 1rem; display: grid; gap: 0.3rem; }
  .phase li { font-size: var(--step--1); color: var(--ink-soft); }

  /* advice lists */
  .split { display: grid; gap: 1.75rem; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
  ul.advice { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.45rem; }
  ul.advice li { display: grid; grid-template-columns: 1.1rem minmax(0, 1fr); gap: 0.4rem; font-size: var(--step--1); color: var(--ink-soft); }
  ul.advice li::before { content: "▸"; color: var(--accent); font-size: 0.75rem; line-height: 1.7; }
  ul.advice.is-danger li::before { content: "✕"; color: var(--crit); }
  ul.advice.is-watch li::before { content: "!"; color: var(--warn); font-family: var(--mono); font-weight: 700; }

  /* lineup ranking */
  .ranking { display: grid; gap: 2px; margin-top: 0.7rem; }
  .rank-row { display: grid; grid-template-columns: 2.4rem minmax(48px, 9rem) minmax(0, 1fr); gap: 0.6rem; align-items: center; font-size: var(--step--1); }
  .rank-score { font-family: var(--mono); font-size: 0.7rem; color: var(--ink-faint); text-align: right; font-variant-numeric: tabular-nums; }
  .rank-row.is-pick .rank-score { color: var(--accent); }
  .rank-bar { height: 6px; background: var(--surface-2); border: 1px solid var(--line-soft); }
  .rank-bar > i { display: block; height: 100%; background: var(--accent); }
  .rank-row.is-pick .rank-name { font-weight: 600; color: var(--ink); }
  .rank-name { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .colophon {
    margin-top: 2.5rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1.2rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="shell">
  <header class="masthead">
    <div>
      <h1 class="wordmark">Battle <span>Lineup</span></h1>
      <p>Command &amp; Conquer: Generals &mdash; Zero Hour &middot; skirmish planner</p>
    </div>
    <div class="stamp" id="stamp">12 armies &middot; 61 units</div>
  </header>

  <div class="board">
    <form class="rail" id="controls" autocomplete="off">
      <fieldset class="field">
        <legend>Your army</legend>
        <div id="you-chips"></div>
      </fieldset>

      <fieldset class="field">
        <legend>Enemy army</legend>
        <div id="enemy-chips"></div>
      </fieldset>

      <fieldset class="field">
        <legend>Difficulty</legend>
        <div class="segmented" id="difficulty"></div>
      </fieldset>

      <fieldset class="field">
        <legend>Map</legend>
        <select id="map-select"></select>
      </fieldset>

      <button type="button" class="ghost-btn" id="reroll">Reroll unset picks</button>
    </form>

    <main class="briefing" id="briefing"></main>
  </div>

  <footer class="colophon" id="colophon"></footer>
</div>

<script>
/*__ENGINE__*/

const DATA = /*__DATASET__*/;

const SIDE_COLOR = { usa: 'var(--usa)', china: 'var(--china)', gla: 'var(--gla)' };
const SIDE_NAME = { usa: 'USA', china: 'China', gla: 'GLA' };
const DIFFICULTIES = ['easy', 'medium', 'hard', 'brutal'];

const state = {
  you: null,            // null = let the planner choose
  enemy: 'china_tank',
  difficulty: 'hard',
  mapId: null,
  seed: 20030922,       // Zero Hour's release date, as a seed
};

const $ = (id) => document.getElementById(id);
const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};

/* ---------------------------------------------------------- controls --- */

function buildChips(container, selected, onPick, anyLabel) {
  container.replaceChildren();

  const anyWrap = el('div', 'chips');
  const anyBtn = el('button', 'chip chip-any', anyLabel);
  anyBtn.type = 'button';
  anyBtn.setAttribute('aria-pressed', String(selected === null));
  anyBtn.addEventListener('click', () => onPick(null));
  anyWrap.append(anyBtn);
  container.append(anyWrap);

  for (const side of ['usa', 'china', 'gla']) {
    const group = el('div', 'side-group');
    group.append(el('div', 'side-label', SIDE_NAME[side]));
    const chips = el('div', 'chips');
    for (const f of DATA.factions.filter((x) => x.side === side)) {
      const btn = el('button', 'chip');
      btn.type = 'button';
      btn.style.setProperty('--sidecolor', SIDE_COLOR[side]);
      btn.setAttribute('aria-pressed', String(selected === f.id));
      btn.append(el('span', null, f.general ? f.name.replace(/^(USA|China|GLA) /, '') : f.name));
      if (f.general) btn.append(el('span', 'chip-sub', f.general.replace(/^(Gen\.|Dr\.|Prince) /, '').split(' ')[0]));
      btn.addEventListener('click', () => onPick(f.id));
      chips.append(btn);
    }
    group.append(chips);
    container.append(group);
  }
}

function buildDifficulty() {
  const box = $('difficulty');
  box.replaceChildren();
  for (const d of DIFFICULTIES) {
    const btn = el('button', 'seg', d);
    btn.type = 'button';
    btn.setAttribute('aria-pressed', String(state.difficulty === d));
    btn.addEventListener('click', () => { state.difficulty = d; render(); });
    box.append(btn);
  }
}

function buildMapSelect() {
  const sel = $('map-select');
  sel.replaceChildren();
  const any = el('option', null, 'No map — general advice');
  any.value = '';
  sel.append(any);
  const sorted = [...DATA.maps].sort((a, b) => a.players - b.players || a.name.localeCompare(b.name));
  for (const m of sorted) {
    const opt = el('option', null, `${m.name} — ${m.players}p, ${m.terrain}`);
    opt.value = m.id;
    sel.append(opt);
  }
  sel.value = state.mapId ?? '';
  sel.addEventListener('change', () => {
    state.mapId = sel.value || null;
    render();
  });
}

/* ---------------------------------------------------------- briefing --- */

function pressureClass(v) {
  return v >= 2.4 ? 'is-crit' : v >= 1.6 ? 'is-warn' : '';
}

function panel(title, count) {
  const section = el('section', 'panel');
  const h2 = el('h2');
  h2.append(document.createTextNode(title));
  if (count) h2.append(el('span', 'count', count));
  section.append(h2);
  return section;
}

function adviceList(items, variant) {
  const ul = el('ul', 'advice' + (variant ? ' ' + variant : ''));
  for (const item of items) ul.append(el('li', null, item));
  return ul;
}

function renderMatchup(plan) {
  const box = el('div', 'matchup');

  const versus = el('div', 'versus');
  versus.append(el('span', 'army-you', plan.you.name));
  versus.append(el('span', 'vs', 'versus'));
  versus.append(el('span', 'army-them', plan.enemy.name));
  box.append(versus);

  if (plan.you.general || plan.enemy.general) {
    const line = el('div', 'commanders');
    if (plan.you.general) {
      const s = el('span');
      s.append(el('b', null, 'You: '), document.createTextNode(plan.you.general));
      line.append(s);
    }
    if (plan.enemy.general) {
      const s = el('span');
      s.append(el('b', null, 'Them: '), document.createTextNode(plan.enemy.general));
      line.append(s);
    }
    box.append(line);
  }

  box.append(el('p', 'headline', plan.headline));

  const tags = el('div', 'conditions');
  tags.append(el('span', `tag tag-diff-${plan.difficulty}`, plan.difficulty));
  tags.append(el('span', 'tag', plan.map ? plan.map.name : 'any map'));
  if (plan.map) {
    tags.append(el('span', 'tag', `${plan.map.players} players`));
    tags.append(el('span', 'tag', `chokepoints ${plan.map.chokepoints}/3`));
    tags.append(el('span', 'tag', `supply ${plan.map.supplyDensity}/3`));
  }
  box.append(tags);

  return box;
}

function renderLineup(plan) {
  if (!plan.lineupRationale) return null;
  const section = panel('Why this lineup', 'scored against their army');
  for (const line of plan.lineupRationale) section.append(el('p', 'unit-why', line));

  const ranking = el('div', 'ranking');
  const top = plan.lineupRanking.slice(0, 6);
  const max = Math.max(1, ...top.map((r) => r.score));
  for (const row of top) {
    const line = el('div', 'rank-row' + (row.faction.id === plan.you.id ? ' is-pick' : ''));
    line.append(el('div', 'rank-score', String(row.score)));
    const bar = el('div', 'rank-bar');
    const fill = el('i');
    fill.style.width = `${(row.score / max) * 100}%`;
    if (row.faction.id !== plan.you.id) fill.style.background = 'var(--line)';
    bar.append(fill);
    line.append(bar);
    line.append(el('div', 'rank-name', row.faction.name));
    ranking.append(line);
  }
  section.append(ranking);
  return section;
}

function renderThreat(plan) {
  const section = panel('Their threat profile', 'pressure on each axis');
  const meters = el('div', 'meters');
  for (const counter of plan.counters) {
    const row = el('div', 'meter');
    row.append(el('div', 'meter-name', AXIS_LABEL[counter.axis]));
    const track = el('div', 'meter-track');
    const fill = el('div', 'meter-fill ' + pressureClass(counter.pressure));
    fill.style.width = `${(Math.min(3, counter.pressure) / 3) * 100}%`;
    track.append(fill);
    row.append(track);
    row.append(el('div', 'meter-val', counter.pressure.toFixed(1)));
    meters.append(row);
  }
  section.append(meters);
  return section;
}

function renderBuildOrder(plan) {
  const section = panel('Build order', `${plan.buildOrder.length} steps`);
  const ol = el('ol', 'steps');
  for (const step of plan.buildOrder) {
    const li = el('li');
    if (/^PRIORITY/.test(step) || /mandatory/i.test(step)) li.className = 'is-priority';
    li.append(el('span', null, step));
    ol.append(li);
  }
  section.append(ol);
  return section;
}

function renderCounters(plan) {
  const section = panel('Counter their game', 'what to build, and why');
  const grid = el('div', 'counter-grid');
  for (const counter of plan.counters) {
    const card = el('div', 'counter');
    const head = el('div', 'counter-head');
    head.append(el('h3', null, AXIS_LABEL[counter.axis]));
    head.append(el('span', 'pressure', `${counter.pressure.toFixed(1)} / 3`));
    card.append(head);

    const ul = el('ul', 'units');
    for (const u of counter.units) {
      const li = el('li', 'unit');
      const name = el('div', 'unit-name');
      name.append(el('span', null, u.name));
      name.append(el('span', 'unit-cost', `${u.cost.toLocaleString()} cr`));
      name.append(el('span', 'unit-tier', u.tier));
      li.append(name);
      li.append(el('div', 'unit-why', u.why));
      ul.append(li);
    }
    card.append(ul);
    card.append(el('div', 'counter-guide', counter.guidance));
    grid.append(card);
  }
  section.append(grid);
  return section;
}

function renderTimeline(plan) {
  const section = panel('Timeline', 'what to be doing, and when');
  const phases = el('div', 'phases');
  for (const phase of plan.timeline) {
    const box = el('div', 'phase');
    box.append(el('h3', null, phase.label));
    box.append(el('span', 'window', phase.window));
    const ul = el('ul');
    for (const o of phase.objectives) ul.append(el('li', null, o));
    box.append(ul);
    phases.append(box);
  }
  section.append(phases);
  return section;
}

function render() {
  let plan;
  try {
    plan = planFrom(DATA, {
      you: state.you ?? undefined,
      enemy: state.enemy ?? undefined,
      difficulty: state.difficulty,
      mapId: state.mapId ?? undefined,
      seed: state.seed,
    });
  } catch (err) {
    const box = $('briefing');
    box.replaceChildren(el('p', 'headline', `Could not build a plan: ${err.message}`));
    return;
  }

  buildChips($('you-chips'), state.you, (id) => { state.you = id; render(); }, 'Let the planner choose');
  buildChips($('enemy-chips'), state.enemy, (id) => { state.enemy = id; render(); }, 'Surprise me');
  buildDifficulty();
  $('map-select').value = state.mapId ?? '';

  const out = $('briefing');
  const parts = [
    renderMatchup(plan),
    renderLineup(plan),
    renderThreat(plan),
    renderBuildOrder(plan),
    renderCounters(plan),
    renderTimeline(plan),
  ].filter(Boolean);

  const split = el('div', 'split');
  const watch = panel('Watch for');
  watch.append(adviceList(plan.watchFor, 'is-watch'));
  const dont = panel('Do not');
  dont.append(adviceList(plan.doNot, 'is-danger'));
  split.append(watch, dont);
  parts.push(split);

  if (plan.matchupNotes.length) {
    const notes = panel('Matchup notes', `${plan.matchupNotes.length} applicable`);
    notes.append(adviceList(plan.matchupNotes));
    parts.push(notes);
  }

  const mapPanel = panel(plan.map ? `Map — ${plan.map.name}` : 'Map');
  mapPanel.append(adviceList(plan.mapNotes));
  if (plan.map && plan.map.features.length) {
    const tags = el('div', 'conditions');
    for (const f of plan.map.features) tags.append(el('span', 'tag', f));
    mapPanel.append(tags);
  }
  parts.push(mapPanel);

  out.replaceChildren(...parts);
}

/* ------------------------------------------------------------- boot --- */

$('stamp').textContent = `${DATA.factions.length} armies · ${DATA.units.length} units · ${DATA.maps.length} maps`;

$('reroll').addEventListener('click', () => {
  state.seed = Math.floor(Math.random() * 1e9);
  render();
});

const prov = DATA.provenance;
$('colophon').replaceChildren(
  el('span', null, `curated dataset ${prov.curatedAt}`),
  el('span', null, prov.wikiCache
    ? `wiki overlay: ${prov.wikiCache.pages} pages from ${prov.wikiCache.source}`
    : 'no wiki overlay — run npm run ingest to merge live wiki data'),
  el('span', null, 'strategy engine runs entirely in this page'),
);

buildMapSelect();
render();
</script>
